<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개발자 영어 플래시카드</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface-2: #1a1a1a;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
      --text: #efefed; --text-muted: #5a5855; --text-dim: #2e2c2a;
      --warm: #d4a574; --blue: #7eb8f7; --green: #7ecf9e; --red: #f07f7f;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 0 1.2rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 7px; height: 7px; background: var(--warm); border-radius: 50%; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; color: var(--text-muted);
    }
    .icon-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .new-btn {
      height: 36px; padding: 0 14px; background: var(--warm); color: #0a0a0a;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: opacity 0.2s;
    }
    .new-btn:hover { opacity: 0.85; }
    .progress-wrap { padding: 12px 1.2rem 0; max-width: 640px; margin: 0 auto; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .progress-stats { display: flex; gap: 12px; }
    .stat { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .stat.done { color: var(--green); }
    .stat.review { color: var(--red); }
    .stat.total { color: var(--text-muted); }
    .bar-track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
    .bar-done { height: 100%; background: var(--green); transition: width 0.4s; }
    .bar-review { height: 100%; background: var(--red); transition: width 0.4s; }
    main { padding: 1rem 1rem 1rem; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .section-label { font-size: 11px; font-weight: 800; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 0; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; transition: border-color 0.2s;
      animation: fadeUp 0.3s ease both;
    }
    .card.is-done { border-color: rgba(126,207,158,0.3); }
    .card.is-review { border-color: rgba(240,127,127,0.3); }
    .card-front { padding: 1rem 1.2rem; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
    .card-top { display: flex; align-items: center; justify-content: space-between; }
    .tag { font-size: 12px; font-weight: 800; color: var(--text-dim); letter-spacing: 0.06em; }
    .card-status { font-size: 15px; }
    .en-text { font-size: 16px; font-weight: 800; color: var(--text); line-height: 1.45; }
    .tap-hint { font-size: 14px; font-weight: 700; color: var(--text-dim); text-align: right; }
    .card-back {
      display: none; flex-direction: column; gap: 6px;
      padding: 0.8rem 1.2rem; border-top: 1px solid var(--border);
    }
    .card.open .card-back { display: flex; }
    .card.open .tap-hint { display: none; }
    .ko-text { font-size: 16px; font-weight: 700; color: var(--warm); line-height: 1.5; }
    .es-text { font-size: 16px; font-weight: 700; color: var(--green); line-height: 1.5; }
    .tip-text {
      font-size: 14px; font-weight: 600; color: var(--text-muted);
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; line-height: 1.6;
    }
    .card-actions { display: none; gap: 8px; padding: 0 1.2rem 1rem; }
    .card.open .card-actions { display: flex; }
    .action-btn {
      flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-weight: 800; font-family: 'Nunito', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.2s; background: var(--surface);
    }
    .btn-done { color: var(--green); border-color: rgba(126,207,158,0.3); }
    .btn-done:hover { background: rgba(126,207,158,0.1); }
    .btn-done.active { background: rgba(126,207,158,0.15); border-color: var(--green); }
    .btn-review { color: var(--red); border-color: rgba(240,127,127,0.3); }
    .btn-review:hover { background: rgba(240,127,127,0.1); }
    .btn-review.active { background: rgba(240,127,127,0.15); border-color: var(--red); }
    .btn-sound { color: var(--blue); border-color: rgba(126,184,247,0.3); flex: 0; padding: 0 14px; }
    .btn-sound:hover { background: rgba(126,184,247,0.1); border-color: var(--blue); }
    .speed-wrap { padding: 0.5rem 1.2rem 1.5rem; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .speed-label { font-size: 13px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
    .speed-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: var(--surface-2); border-radius: 99px; outline: none; }
    .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--warm); border-radius: 50%; cursor: pointer; }
    .speed-val { font-size: 14px; font-weight: 800; color: var(--warm); min-width: 36px; text-align: right; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 340px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-desc { font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.6; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .modal-btn {
      height: 46px; border-radius: 12px; font-size: 15px; font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s;
    }
    .modal-btn.danger-all { background: rgba(240,127,127,0.12); color: var(--red); border-color: rgba(240,127,127,0.3); }
    .modal-btn.danger-all:hover { background: rgba(240,127,127,0.22); }
    .modal-btn.danger-review { background: rgba(212,165,116,0.1); color: var(--warm); border-color: rgba(212,165,116,0.3); }
    .modal-btn.danger-review:hover { background: rgba(212,165,116,0.2); }
    .modal-btn.cancel { background: var(--surface-2); color: var(--text-muted); }
    .modal-btn.cancel:hover { color: var(--text); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    footer { text-align: center; padding: 1.5rem; font-size: 13px; font-weight: 700; color: var(--text-dim); border-top: 1px solid var(--border); }
  </style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-dot"></span>개발자 영어</div>
  <div class="header-right">
    <button class="icon-btn" id="settingsBtn">⚙️</button>
    <button class="new-btn" id="newBtn">🔀 새 문장</button>
  </div>
</header>
<div class="progress-wrap">
  <div class="progress-row">
    <div class="progress-stats">

      <span class="stat review" id="statReview">🔁 복습 0</span>
      <span class="stat total">전체 502</span>
    </div>
    <span style="font-size:12px;font-weight:700;color:var(--text-dim)" id="statPct">0%</span>
  </div>
  <div class="bar-track">
    <div class="bar-done" id="barDone" style="width:0%"></div>
    <div class="bar-review" id="barReview" style="width:0%"></div>
  </div>
</div>
<main id="main"><div class="section-label">오늘의 10문장</div></main>
<div class="speed-wrap">
  <span class="speed-label">🐢 속도</span>
  <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="1.5" step="0.1" value="0.85">
  <span class="speed-val" id="speedVal">0.9x</span>
</div>
<footer>개발자 영어 플래시카드 · 502개 문장</footer>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">⚙️ 학습 초기화</div>
    <div class="modal-desc">체크했던 기억/복습 기록을 초기화해요.<br>전체 또는 복습 카드만 선택할 수 있어요.</div>
    <div class="modal-btns">
      <button class="modal-btn danger-all" id="resetAll">🗑️ 전체 초기화</button>
      <button class="modal-btn danger-review" id="resetReview">🔁 복습 카드만 초기화</button>
      <button class="modal-btn cancel" id="closeModal">취소</button>
    </div>
  </div>
</div>

    {en:"This method is synchronous in v1.x but was changed to return a Promise in v2.0. Update your code accordingly.",es:"Este m\u00e9todo es s\u00edncrono en v1.x pero se cambi\u00f3 para devolver una Promise en v2.0. Actualiza tu c\u00f3digo en consecuencia.",ko:"\uc774 \uba54\uc11c\ub4dc\ub294 v1.x\uc5d0\uc11c \ub3d9\uae30\uc2dd\uc774\uc9c0\ub9cc v2.0\uc5d0\uc11c Promise\ub97c \ubc18\ud658\ud558\ub3c4\ub85d \ubcc0\uacbd\ub410\uc5b4\uc694. \ucf54\ub4dc\ub97c \uadf8\uc5d0 \ub9de\uac8c \uc5c5\ub370\uc774\ud2b8\ud574\uc694.",tip:"\ubc84\uc804 \uc5c5\uadf8\ub808\uc774\ub4dc \uc2dc \ube44\ub3d9\uae30\ud654\ub41c \uba54\uc11c\ub4dc\ub294 await\ub97c \ucd94\uac00\ud574\uc57c \ud574\uc694"},
    {en:"The timeout value is specified in milliseconds. Set to 0 to disable the timeout entirely.",es:"El valor de tiempo de espera se especifica en milisegundos. Establece en 0 para deshabilitar el tiempo de espera por completo.",ko:"\ud0c0\uc784\uc544\uc6c3 \uac12\uc740 \ubc00\ub9ac\ucd08\ub85c \uc9c0\uc815\ud574\uc694. \ud0c0\uc784\uc544\uc6c3\uc744 \uc644\uc804\ud788 \ube44\ud65c\uc131\ud654\ud558\ub824\uba74 0\uc73c\ub85c \uc124\uc815\ud574\uc694.",tip:"\ud0c0\uc784\uc544\uc6c3\uc744 0\uc73c\ub85c \uc124\uc815\ud558\uba74 \ubb34\uae30\ud55c \ub300\uae30\ud558\ubbc0\ub85c \uc6b4\uc601 \ud658\uacbd\uc5d0\uc11c\ub294 \uc8fc\uc758\ud574\uc694"},
    {en:"This feature requires the --experimental-vm-modules flag to be enabled when running Node.js.",es:"Esta funci\u00f3n requiere que el indicador --experimental-vm-modules est\u00e9 habilitado al ejecutar Node.js.",ko:"\uc774 \uae30\ub2a5\uc740 Node.js \uc2e4\ud589 \uc2dc --experimental-vm-modules \ud50c\ub798\uadf8\uac00 \ud65c\uc131\ud654\ub418\uc5b4\uc57c \ud574\uc694.",tip:"experimental \ud50c\ub798\uadf8\ub294 \ubc84\uc804\uc5d0 \ub530\ub77c \ubcc0\uacbd\ub420 \uc218 \uc788\uc5b4\uc694. \ub9b4\ub9ac\uc988 \ub178\ud2b8\ub97c \ud655\uc778\ud574\uc694"},

    {en:"If the operation succeeds, the returned object will have a status field set to 'ok'. On failure, it will be set to 'error'.",es:"Si la operaci\u00f3n tiene \u00e9xito, el objeto devuelto tendr\u00e1 un campo de estado establecido en 'ok'. En caso de fallo, se establecer\u00e1 en 'error'.",ko:"\uc791\uc5c5\uc774 \uc131\uacf5\ud558\uba74 \ubc18\ud658\ub41c \uac1d\uccb4\uc758 status \ud544\ub4dc\uac00 'ok'\ub85c \uc124\uc815\ub3fc\uc694. \uc2e4\ud328\ud558\uba74 'error'\ub85c \uc124\uc815\ub3fc\uc694.",tip:"\uc0c1\ud0dc \ucf54\ub4dc \ub300\uc2e0 status \ud544\ub4dc\ub85c \uc131\uacf5/\uc2e4\ud328\ub97c \ub098\ud0c0\ub0b4\ub294 \ud328\ud134\uc774\uc5d0\uc694"},
    {en:"All date values are serialized as ISO 8601 strings. Parsing them back to Date objects is the responsibility of the consumer.",es:"Todos los valores de fecha se serializan como cadenas ISO 8601. Volver a analizarlos como objetos Date es responsabilidad del consumidor.",ko:"\ubaa8\ub4e0 \ub0a0\uc9dc \uac12\uc740 ISO 8601 \ubb38\uc790\uc5f4\ub85c \uc9c1\ub82c\ud654\ub3fc\uc694. Date \uac1d\uccb4\ub85c \ub2e4\uc2dc \ud30c\uc2f1\ud558\ub294 \uac83\uc740 \uc18c\ube44\uc790\uc758 \ucc45\uc784\uc774\uc5d0\uc694.",tip:"new Date(isoString) \uc73c\ub85c ISO 8601 \ubb38\uc790\uc5f4\uc744 Date \uac1d\uccb4\ub85c \ubcc0\ud658\ud574\uc694"},
    {en:"This class uses the Singleton pattern. Use getInstance() instead of calling the constructor directly.",es:"Esta clase usa el patr\u00f3n Singleton. Usa getInstance() en lugar de llamar al constructor directamente.",ko:"\uc774 \ud074\ub798\uc2a4\ub294 \uc2f1\uae00\ud1a4 \ud328\ud134\uc744 \uc0ac\uc6a9\ud574\uc694. \uc0dd\uc131\uc790\ub97c \uc9c1\uc811 \ud638\ucd9c\ud558\ub294 \ub300\uc2e0 getInstance()\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"Singleton = \uc778\uc2a4\ud134\uc2a4\uac00 \ud558\ub098\ub9cc \uc874\uc7ac\ud558\ub3c4\ub85d \ubcf4\uc7a5\ud558\ub294 \ud328\ud134\uc774\uc5d0\uc694"},
    {en:"The middleware stack is executed in registration order. Order matters \u2014 place authentication before authorization.",es:"La pila de middleware se ejecuta en orden de registro. El orden importa \u2014 coloca la autenticaci\u00f3n antes que la autorizaci\u00f3n.",ko:"\ubbf8\ub4e4\uc6e8\uc5b4 \uc2a4\ud0dd\uc740 \ub4f1\ub85d \uc21c\uc11c\ub300\ub85c \uc2e4\ud589\ub3fc\uc694. \uc21c\uc11c\uac00 \uc911\uc694\ud574\uc694 \u2014 \uc778\uc99d\uc744 \uc778\uac00 \uc804\uc5d0 \ubc30\uce58\ud574\uc694.",tip:"\ubbf8\ub4e4\uc6e8\uc5b4 \uc21c\uc11c \uc624\ub958\ub294 \uc790\uc8fc \ubc1c\uc0dd\ud558\ub294 \ubc84\uadf8\uc608\uc694. \uc21c\uc11c\ub97c \ud56d\uc0c1 \ud655\uc778\ud574\uc694"},
    {en:"Calling this method on an already-closed connection will throw an InvalidStateError.",es:"Llamar a este m\u00e9todo en una conexi\u00f3n ya cerrada lanzar\u00e1 un InvalidStateError.",ko:"\uc774\ubbf8 \ub2eb\ud78c \uc5f0\uacb0\uc5d0\uc11c \uc774 \uba54\uc11c\ub4dc\ub97c \ud638\ucd9c\ud558\uba74 InvalidStateError\uac00 \ubc1c\uc0dd\ud574\uc694.",tip:"\uc5f0\uacb0 \uc0c1\ud0dc\ub97c \ud655\uc778\ud55c \ud6c4 \uba54\uc11c\ub4dc\ub97c \ud638\ucd9c\ud558\ub294 \ubc29\uc5b4\uc801 \ud504\ub85c\uadf8\ub798\ubc0d\uc774 \ud544\uc694\ud574\uc694"},
    {en:"The library is fully tree-shakeable. Only the functions you import will be included in your production bundle.",es:"La biblioteca es completamente tree-shakeable. Solo las funciones que importes se incluir\u00e1n en tu bundle de producci\u00f3n.",ko:"\ub77c\uc774\ube0c\ub7ec\ub9ac\ub294 \uc644\uc804\ud788 \ud2b8\ub9ac \uc250\uc774\ud0b9\uc774 \uac00\ub2a5\ud574\uc694. import\ud55c \ud568\uc218\ub9cc \ud504\ub85c\ub355\uc158 \ubc88\ub4e4\uc5d0 \ud3ec\ud568\ub3fc\uc694.",tip:"named export \ubc29\uc2dd\uc774 default export\ubcf4\ub2e4 tree-shaking\uc5d0 \uc720\ub9ac\ud574\uc694"},
    {en:"This hook must be used inside a component that is wrapped by the corresponding Provider component.",es:"Este hook debe usarse dentro de un componente que est\u00e9 envuelto por el componente Provider correspondiente.",ko:"\uc774 \ud6c5\uc740 \ud574\ub2f9 Provider \ucef4\ud3ec\ub10c\ud2b8\ub85c \uac10\uc2f8\uc9c4 \ucef4\ud3ec\ub10c\ud2b8 \ub0b4\ubd80\uc5d0\uc11c \uc0ac\uc6a9\ud574\uc57c \ud574\uc694.",tip:"Context \ud6c5\uc740 \ud574\ub2f9 Context\uc758 Provider \ud558\uc704 \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c\ub9cc \uc0ac\uc6a9\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"For production deployments, always set the secure flag to true on session cookies to prevent transmission over HTTP.",es:"Para despliegues de producci\u00f3n, siempre establece el indicador secure en true en las cookies de sesi\u00f3n para evitar la transmisi\u00f3n por HTTP.",ko:"\ud504\ub85c\ub355\uc158 \ubc30\ud3ec\uc5d0\uc11c HTTP\ub97c \ud1b5\ud55c \uc804\uc1a1\uc744 \ubc29\uc9c0\ud558\uae30 \uc704\ud574 \uc138\uc158 \ucfe0\ud0a4\uc5d0 \ud56d\uc0c1 secure \ud50c\ub798\uadf8\ub97c true\ub85c \uc124\uc815\ud574\uc694.",tip:"secure \ucfe0\ud0a4\ub294 HTTPS \uc5f0\uacb0\uc5d0\uc11c\ub9cc \uc804\uc1a1\ub3fc\uc694. \ubcf4\uc548\uc744 \uc704\ud574 \ud544\uc218\uc608\uc694"},
    {en:"The package ships with both CommonJS and ES Module builds. Your bundler will automatically choose the correct format.",es:"El paquete incluye tanto builds de CommonJS como de ES Module. Tu bundler elegir\u00e1 autom\u00e1ticamente el formato correcto.",ko:"\ud328\ud0a4\uc9c0\ub294 CommonJS\uc640 ES \ubaa8\ub4c8 \ube4c\ub4dc\ub97c \ubaa8\ub450 \uc81c\uacf5\ud574\uc694. \ubc88\ub4e4\ub7ec\uac00 \uc790\ub3d9\uc73c\ub85c \uc62c\ubc14\ub978 \ud615\uc2dd\uc744 \uc120\ud0dd\ud574\uc694.",tip:"dual package = CJS\uc640 ESM\uc744 \ubaa8\ub450 \uc9c0\uc6d0\ud558\ub294 \ud328\ud0a4\uc9c0\uc608\uc694. package.json\uc758 exports \ud544\ub4dc\ub85c \uc124\uc815\ud574\uc694"},

    {en:"We're reaching the capacity limit on the current database. We should plan for a scaling solution next sprint.",es:"Estamos alcanzando el l\u00edmite de capacidad de la base de datos actual. Deber\u00edamos planificar una soluci\u00f3n de escalado para el pr\u00f3ximo sprint.",ko:"\ud604\uc7ac \ub370\uc774\ud130\ubca0\uc774\uc2a4\uc758 \uc6a9\ub7c9 \ud55c\uacc4\uc5d0 \ub3c4\ub2ec\ud558\uace0 \uc788\uc5b4\uc694. \ub2e4\uc74c \uc2a4\ud504\ub9b0\ud2b8\uc5d0\uc11c \ud655\uc7a5 \uc194\ub8e8\uc158\uc744 \uacc4\ud68d\ud574\uc57c \ud574\uc694.",tip:"\uc6a9\ub7c9 \ubb38\uc81c\ub294 \ud55c\uacc4\uc5d0 \ub3c4\ub2ec\ud558\uae30 \uc804\uc5d0 \ubbf8\ub9ac \uacc4\ud68d\ud558\ub294 \uac83\uc774 \uc911\uc694\ud574\uc694"},
    {en:"The API contract has changed. Please update your client code before Monday's deployment.",es:"El contrato de API ha cambiado. Por favor, actualiza el c\u00f3digo de tu cliente antes del despliegue del lunes.",ko:"API \uacc4\uc57d\uc774 \ubcc0\uacbd\ub410\uc5b4\uc694. \uc6d4\uc694\uc77c \ubc30\ud3ec \uc804\uc5d0 \ud074\ub77c\uc774\uc5b8\ud2b8 \ucf54\ub4dc\ub97c \uc5c5\ub370\uc774\ud2b8\ud574\uc8fc\uc138\uc694.",tip:"API \ubcc0\uacbd \uc2dc \ubaa8\ub4e0 \uc18c\ube44\uc790\uc5d0\uac8c \ucda9\ubd84\ud55c \uc2dc\uac04\uc744 \ub450\uace0 \uacf5\uc9c0\ud574\uc694"},
    {en:"I'll set up feature flags so we can enable this gradually without a full deployment.",es:"Configurar\u00e9 feature flags para que podamos habilitarlo gradualmente sin un despliegue completo.",ko:"\uc804\uccb4 \ubc30\ud3ec \uc5c6\uc774 \uc810\uc9c4\uc801\uc73c\ub85c \ud65c\uc131\ud654\ud560 \uc218 \uc788\ub3c4\ub85d \uae30\ub2a5 \ud50c\ub798\uadf8\ub97c \uc124\uc815\ud560\uac8c\uc694.",tip:"feature flag = \ucf54\ub4dc \ubc30\ud3ec\uc640 \uae30\ub2a5 \ud65c\uc131\ud654\ub97c \ubd84\ub9ac\ud558\ub294 \uae30\ubc95\uc774\uc5d0\uc694"},

    {en:"We should invest in improving our local development setup. The current onboarding takes too long for new team members.",es:"Deber\u00edamos invertir en mejorar nuestro entorno de desarrollo local. La incorporaci\u00f3n actual lleva demasiado tiempo para los nuevos miembros del equipo.",ko:"\ub85c\uceec \uac1c\ubc1c \ud658\uacbd \uac1c\uc120\uc5d0 \ud22c\uc790\ud574\uc57c \ud574\uc694. \ud604\uc7ac \uc628\ubcf4\ub529\uc774 \uc0c8 \ud300\uc6d0\uc5d0\uac8c \ub108\ubb34 \uc624\ub798 \uac78\ub824\uc694.",tip:"\uc88b\uc740 \uac1c\ubc1c \ud658\uacbd = \ud300 \uc0dd\uc0b0\uc131\uacfc \uc0c8 \uba64\ubc84 \uc628\ubcf4\ub529 \uc18d\ub3c4\uc5d0 \uc9c1\uacb0\ub3fc\uc694"},
    {en:"I'll prepare the release notes and coordinate with the marketing team on the announcement.",es:"Preparar\u00e9 las notas de versi\u00f3n y coordinar\u00e9 con el equipo de marketing sobre el anuncio.",ko:"\ub9b4\ub9ac\uc988 \ub178\ud2b8\ub97c \uc900\ube44\ud558\uace0 \ubc1c\ud45c\uc5d0 \ub300\ud574 \ub9c8\ucf00\ud305 \ud300\uacfc \uc870\uc728\ud560\uac8c\uc694.",tip:"\ub9b4\ub9ac\uc988 \ub178\ud2b8\ub294 \uc0ac\uc6a9\uc790\uc640 \ud300 \ubaa8\ub450\ub97c \uc704\ud55c \uc911\uc694\ud55c \ucee4\ubba4\ub2c8\ucf00\uc774\uc158\uc774\uc5d0\uc694"},

    {en:"Let's establish a clear Definition of Done for this project so everyone knows when a task is truly complete.",es:"Establezcamos una definici\u00f3n clara de Terminado para este proyecto para que todos sepan cu\u00e1ndo una tarea est\u00e1 verdaderamente completa.",ko:"\ubaa8\ub4e0 \uc0ac\ub78c\uc774 \uc791\uc5c5\uc774 \uc9c4\uc815\uc73c\ub85c \uc644\ub8cc\ub410\uc744 \ub54c\ub97c \uc54c \uc218 \uc788\ub3c4\ub85d \uc774 \ud504\ub85c\uc81d\ud2b8\uc758 \uba85\ud655\ud55c \uc644\ub8cc \uc815\uc758\ub97c \uc218\ub9bd\ud574\uc694.",tip:"Definition of Done = \uc791\uc5c5\uc774 \uc644\ub8cc\ub410\ub2e4\uace0 \ubcfc \uc218 \uc788\ub294 \uae30\uc900\uc774\uc5d0\uc694"},
    {en:"I'll create a runbook for this deployment so anyone on the team can execute it safely.",es:"Crear\u00e9 un runbook para este despliegue para que cualquier miembro del equipo pueda ejecutarlo de manera segura.",ko:"\ud300\uc758 \ub204\uad6c\ub098 \uc548\uc804\ud558\uac8c \uc2e4\ud589\ud560 \uc218 \uc788\ub3c4\ub85d \uc774 \ubc30\ud3ec\ub97c \uc704\ud55c runbook\uc744 \ub9cc\ub4e4\uac8c\uc694.",tip:"runbook = \ubc18\ubcf5\uc801\uc778 \uc791\uc5c5\uc744 \ub204\uad6c\ub098 \uc2e4\ud589\ud560 \uc218 \uc788\ub3c4\ub85d \ub2e8\uacc4\ubcc4\ub85c \ubb38\uc11c\ud654\ud55c \uac83\uc774\uc5d0\uc694"},

    {en:"Let's agree on a code review SLA \u2014 I'll propose that all PRs receive at least one review within 24 business hours.",es:"Acordemos un SLA de revisi\u00f3n de c\u00f3digo \u2014 propongo que todos los PRs reciban al menos una revisi\u00f3n dentro de las 24 horas h\u00e1biles.",ko:"\ucf54\ub4dc \ub9ac\ubdf0 SLA\uc5d0 \ub3d9\uc758\ud574\uc694 \u2014 \ubaa8\ub4e0 PR\uc774 24 \uc601\uc5c5 \uc2dc\uac04 \ub0b4\uc5d0 \ucd5c\uc18c \ud55c \ubc88\uc758 \ub9ac\ubdf0\ub97c \ubc1b\ub3c4\ub85d \uc81c\uc548\ud574\uc694.",tip:"SLA = Service Level Agreement. \uc11c\ube44\uc2a4 \uc218\uc900 \ud569\uc758\ub85c \ud300\uc758 \uae30\ub300\uce58\ub97c \uba85\ud655\ud788 \ud574\uc694"}

    {en:"Excellent refactoring! The new version is much cleaner and easier to test than the original.",es:"\u00a1Excelente refactorizaci\u00f3n! La nueva versi\u00f3n es mucho m\u00e1s limpia y f\u00e1cil de probar que la original.",ko:"\ud6cc\ub96d\ud55c \ub9ac\ud329\ud1a0\ub9c1\uc774\uc5d0\uc694! \uc0c8 \ubc84\uc804\uc774 \uc6d0\ubcf8\ubcf4\ub2e4 \ud6e8\uc52c \uae54\ub054\ud558\uace0 \ud14c\uc2a4\ud2b8\ud558\uae30 \uc26c\uc6cc\uc694.",tip:"\ub9ac\ud329\ud1a0\ub9c1\uc758 \ubaa9\ud45c\ub294 \ub3d9\uc791\uc740 \uc720\uc9c0\ud558\uba74\uc11c \ucf54\ub4dc \ud488\uc9c8\uc744 \ub192\uc774\ub294 \uac70\uc608\uc694"},
    {en:"There's a potential race condition if two requests modify the same resource simultaneously \u2014 add proper locking.",es:"Hay una posible condici\u00f3n de carrera si dos solicitudes modifican el mismo recurso simult\u00e1neamente \u2014 agrega bloqueo adecuado.",ko:"\ub450 \uc694\uccad\uc774 \ub3d9\uc2dc\uc5d0 \ub3d9\uc77c\ud55c \ub9ac\uc18c\uc2a4\ub97c \uc218\uc815\ud558\uba74 \uacbd\uc7c1 \uc870\uac74\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc5b4\uc694 \u2014 \uc801\uc808\ud55c \uc7a0\uae08\uc744 \ucd94\uac00\ud574\uc694.",tip:"race condition\uc740 \ub3d9\uc2dc\uc131\uc774 \uc788\ub294 \uc2dc\uc2a4\ud15c\uc5d0\uc11c \ud754\ud55c \ubc84\uadf8\uc608\uc694"},
    {en:"The test name doesn't clearly describe what's being tested. Can you rename it to follow the 'should do X when Y' pattern?",es:"El nombre del test no describe claramente lo que se est\u00e1 probando. \u00bfPuedes renombrarlo para seguir el patr\u00f3n 'debe hacer X cuando Y'?",ko:"\ud14c\uc2a4\ud2b8 \uc774\ub984\uc774 \ubb34\uc5c7\uc744 \ud14c\uc2a4\ud2b8\ud558\ub294\uc9c0 \uba85\ud655\ud558\uac8c \uc124\uba85\ud558\uc9c0 \uc54a\uc544\uc694. 'X \ud560 \ub54c Y \ud574\uc57c \ud55c\ub2e4' \ud328\ud134\uc744 \ub530\ub974\ub3c4\ub85d \uc774\ub984\uc744 \ubcc0\uacbd\ud574\uc904 \uc218 \uc788\ub098\uc694?",tip:"\uc88b\uc740 \ud14c\uc2a4\ud2b8 \uc774\ub984\uc740 \ud14c\uc2a4\ud2b8\uac00 \uc2e4\ud328\ud588\uc744 \ub54c \ubb34\uc5c7\uc774 \uc798\ubabb\ub410\ub294\uc9c0 \uc989\uc2dc \uc54c\ub824\uc918\uc694"},
    {en:"Using a forEach here instead of map loses the return value. Use map since you're creating a new array.",es:"Usar forEach aqu\u00ed en lugar de map pierde el valor de retorno. Usa map ya que est\u00e1s creando un nuevo array.",ko:"\uc5ec\uae30\uc11c map \ub300\uc2e0 forEach\ub97c \uc0ac\uc6a9\ud558\uba74 \ubc18\ud658\uac12\uc774 \uc190\uc2e4\ub3fc\uc694. \uc0c8 \ubc30\uc5f4\uc744 \uc0dd\uc131\ud558\ubbc0\ub85c map\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"forEach = \ubd80\uc791\uc6a9, map = \uc0c8 \ubc30\uc5f4 \uc0dd\uc131. \ubaa9\uc801\uc5d0 \ub9de\ub294 \uba54\uc11c\ub4dc\ub97c \uc120\ud0dd\ud574\uc694"},
    {en:"The magic number 86400 should be a named constant \u2014 something like SECONDS_PER_DAY would be much clearer.",es:"El n\u00famero m\u00e1gico 86400 deber\u00eda ser una constante con nombre \u2014 algo como SECONDS_PER_DAY ser\u00eda mucho m\u00e1s claro.",ko:"\ub9e4\uc9c1 \ub118\ubc84 86400\uc740 \uc774\ub984 \uc788\ub294 \uc0c1\uc218\uac00 \ub418\uc5b4\uc57c \ud574\uc694 \u2014 SECONDS_PER_DAY \uac19\uc740 \uac83\uc774 \ud6e8\uc52c \uba85\ud655\ud560 \uac70\uc608\uc694.",tip:"\ub9e4\uc9c1 \ub118\ubc84 = \uc758\ubbf8\ub97c \ubaa8\ub974\ub294 \uc22b\uc790. \ud56d\uc0c1 \uc0c1\uc218\ub85c \uba85\uc2dc\ud574\uc694"},
    {en:"This API call is happening outside useEffect which will cause it to fire on every render. Move it inside.",es:"Esta llamada a la API est\u00e1 ocurriendo fuera de useEffect lo que har\u00e1 que se dispare en cada renderizado. Mu\u00e9vela dentro.",ko:"\uc774 API \ud638\ucd9c\uc774 useEffect \ubc16\uc5d0\uc11c \ubc1c\uc0dd\ud558\uace0 \uc788\uc5b4\uc11c \ub9e4 \ub80c\ub354\ub9c1\ub9c8\ub2e4 \uc2e4\ud589\ub3fc\uc694. \uc548\uc73c\ub85c \uc774\ub3d9\ud574\uc694.",tip:"\ub370\uc774\ud130 \ud328\uce6d\uc740 \ud56d\uc0c1 useEffect \ub610\ub294 \uc774\ubca4\ud2b8 \ud578\ub4e4\ub7ec \uc548\uc5d0\uc11c \ud574\uc57c \ud574\uc694"},

    {en:"The error message is not descriptive enough. Include what value was received and what was expected.",es:"El mensaje de error no es suficientemente descriptivo. Incluye qu\u00e9 valor se recibi\u00f3 y qu\u00e9 se esperaba.",ko:"\uc624\ub958 \uba54\uc2dc\uc9c0\uac00 \ucda9\ubd84\ud788 \uc124\uba85\uc801\uc774\uc9c0 \uc54a\uc544\uc694. \ubc1b\uc740 \uac12\uacfc \uc608\uc0c1\ud588\ub358 \uac12\uc744 \ud3ec\ud568\ud574\uc694.",tip:"\uc88b\uc740 \uc624\ub958 \uba54\uc2dc\uc9c0\ub294 \ubb38\uc81c\ub97c \uc9c4\ub2e8\ud558\ub294 \ub370 \uac78\ub9ac\ub294 \uc2dc\uac04\uc744 \ud06c\uac8c \uc904\uc5ec\uc918\uc694"},
    {en:"This switch statement will grow forever as new types are added. Consider using a strategy pattern or a map instead.",es:"Esta instrucci\u00f3n switch crecer\u00e1 indefinidamente a medida que se agreguen nuevos tipos. Considera usar un patr\u00f3n de estrategia o un mapa en su lugar.",ko:"\uc0c8 \ud0c0\uc785\uc774 \ucd94\uac00\ub420\uc218\ub85d \uc774 switch \ubb38\uc740 \uacc4\uc18d \ucee4\uc9c8 \uac70\uc608\uc694. \ub300\uc2e0 \uc804\ub7b5 \ud328\ud134\uc774\ub098 \ub9f5 \uc0ac\uc6a9\uc744 \uace0\ub824\ud574\uc694.",tip:"\uac1c\ubc29-\ud3d0\uc1c4 \uc6d0\uce59(OCP) = \ud655\uc7a5\uc5d0 \uc5f4\ub824\uc788\uace0 \uc218\uc815\uc5d0 \ub2eb\ud600\uc788\uc5b4\uc57c \ud574\uc694"},
    {en:"The comment explains what the code does, not why. The 'why' is much more valuable for future maintainers.",es:"El comentario explica qu\u00e9 hace el c\u00f3digo, no por qu\u00e9. El 'por qu\u00e9' es mucho m\u00e1s valioso para los futuros mantenedores.",ko:"\uc8fc\uc11d\uc774 \ucf54\ub4dc\uac00 \ubb34\uc5c7\uc744 \ud558\ub294\uc9c0 \uc124\uba85\ud558\uace0 \uc788\uc5b4\uc694, \uc65c \ud558\ub294\uc9c0\uac00 \uc544\ub2c8\ub77c\uc694. '\uc65c'\uac00 \ubbf8\ub798 \uc720\uc9c0\ubcf4\uc218\uc790\uc5d0\uac8c \ud6e8\uc52c \ub354 \uac00\uce58 \uc788\uc5b4\uc694.",tip:"\uc88b\uc740 \uc8fc\uc11d = \ucf54\ub4dc\uc758 \uc758\ub3c4\uc640 \uc774\uc720\ub97c \uc124\uba85. \ucf54\ub4dc\ub97c \uadf8\ub300\ub85c \uc77d\uc5b4\uc8fc\ub294 \uc8fc\uc11d\uc740 \ubd88\ud544\uc694\ud574\uc694"},
    {en:"This is an excellent approach for handling the pagination \u2014 clear, testable, and follows the existing patterns.",es:"Este es un excelente enfoque para manejar la paginaci\u00f3n \u2014 claro, comprobable y sigue los patrones existentes.",ko:"\ud398\uc774\uc9c0\ub124\uc774\uc158 \ucc98\ub9ac\uc5d0 \ub300\ud55c \ud6cc\ub96d\ud55c \uc811\uadfc \ubc29\uc2dd\uc774\uc5d0\uc694 \u2014 \uba85\ud655\ud558\uace0 \ud14c\uc2a4\ud2b8 \uac00\ub2a5\ud558\uba70 \uae30\uc874 \ud328\ud134\uc744 \ub530\ub77c\uc694.",tip:"\uae30\uc874 \ud328\ud134\uc744 \ub530\ub974\uba74 \ucf54\ub4dc \uc77c\uad00\uc131\uc774 \ub192\uc544\uc9c0\uace0 \ud300\uc774 \uc774\ud574\ud558\uae30 \uc26c\uc6cc\uc694"},
    {en:"The async operation is not awaited \u2014 this could cause unhandled promise rejections.",es:"La operaci\u00f3n as\u00edncrona no est\u00e1 siendo esperada \u2014 esto podr\u00eda causar rechazos de promesas no manejados.",ko:"\ube44\ub3d9\uae30 \uc791\uc5c5\uc5d0 await\uac00 \uc5c6\uc5b4\uc694 \u2014 \ucc98\ub9ac\ub418\uc9c0 \uc54a\uc740 promise \uac70\ubd80\uac00 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc5b4\uc694.",tip:"async \ud568\uc218 \ud638\ucd9c\uc5d0\ub294 \ud56d\uc0c1 await\ub97c \ubd99\uc774\uac70\ub098 .catch()\ub85c \uc5d0\ub7ec\ub97c \ucc98\ub9ac\ud574\uc694"},
    {en:"Good catch on that edge case! This would have been a subtle bug in production.",es:"\u00a1Buen hallazgo en ese caso extremo! Habr\u00eda sido un error sutil en producci\u00f3n.",ko:"\uadf8 \uc5e3\uc9c0 \ucf00\uc774\uc2a4\ub97c \uc798 \uc7a1\uc558\uc5b4\uc694! \ud504\ub85c\ub355\uc158\uc5d0\uc11c \ubbf8\ubb18\ud55c \ubc84\uadf8\uac00 \ub410\uc744 \uac70\uc608\uc694.",tip:"\uc5e3\uc9c0 \ucf00\uc774\uc2a4\ub97c \ucf54\ub4dc \ub9ac\ubdf0\uc5d0\uc11c \ubc1c\uacac\ud558\ub294 \uac83\uc774 QA\ubcf4\ub2e4 \ud6e8\uc52c \uc800\ub834\ud574\uc694"},

    {en:"The test coverage for the error path is missing. What happens when the API call fails?",es:"Falta la cobertura de pruebas para el camino de error. \u00bfQu\u00e9 sucede cuando falla la llamada a la API?",ko:"\uc624\ub958 \uacbd\ub85c\uc5d0 \ub300\ud55c \ud14c\uc2a4\ud2b8 \ucee4\ubc84\ub9ac\uc9c0\uac00 \uc5c6\uc5b4\uc694. API \ud638\ucd9c\uc774 \uc2e4\ud328\ud558\uba74 \uc5b4\ub5bb\uac8c \ub418\ub098\uc694?",tip:"\uc131\uacf5 \uacbd\ub85c\ubfd0 \uc544\ub2c8\ub77c \uc2e4\ud328 \uacbd\ub85c\ub3c4 \ud56d\uc0c1 \ud14c\uc2a4\ud2b8\ud574\uc57c \ud574\uc694"},

    {en:"The hydration warning suggests a mismatch between server and client.",es:"La advertencia de hidrataci\u00f3n sugiere una discrepancia entre el servidor y el cliente.",ko:"\ud558\uc774\ub4dc\ub808\uc774\uc158 \uacbd\uace0\ub294 \uc11c\ubc84\uc640 \ud074\ub77c\uc774\uc5b8\ud2b8 \uac04 \ubd88\uc77c\uce58\ub97c \ub098\ud0c0\ub0b4\uc694.",tip:"Date.now()\ub098 Math.random() \uac19\uc740 \uac12\uc744 \uc11c\ubc84\uc5d0\uc11c \uc4f0\uba74 \uc0dd\uaca8\uc694"},
    {en:"Wrap client-only code in useEffect to avoid SSR issues.",es:"Envuelve el c\u00f3digo solo de cliente en useEffect para evitar problemas de SSR.",ko:"SSR \ubb38\uc81c\ub97c \ud53c\ud558\ub824\uba74 \ud074\ub77c\uc774\uc5b8\ud2b8 \uc804\uc6a9 \ucf54\ub4dc\ub97c useEffect\ub85c \uac10\uc2f8\uc694.",tip:"window, document \uac19\uc740 \ube0c\ub77c\uc6b0\uc800 API\ub294 \uc11c\ubc84\uc5d0\uc11c \uc2e4\ud589 \uc548 \ub3fc\uc694"},
    {en:"Parallel routes allow rendering multiple pages simultaneously.",es:"Las rutas paralelas permiten renderizar m\u00faltiples p\u00e1ginas simult\u00e1neamente.",ko:"\ubcd1\ub82c \ub77c\uc6b0\ud2b8\ub294 \uc5ec\ub7ec \ud398\uc774\uc9c0\ub97c \ub3d9\uc2dc\uc5d0 \ub80c\ub354\ub9c1\ud560 \uc218 \uc788\uc5b4\uc694.",tip:"Next.js 13+ App Router\uc758 @folder \ubb38\ubc95\uc744 \uc368\uc694"},
    {en:"ISR allows updating static pages after deployment.",es:"ISR permite actualizar p\u00e1ginas est\u00e1ticas despu\u00e9s del despliegue.",ko:"ISR\uc740 \ubc30\ud3ec \ud6c4\uc5d0\ub3c4 \uc815\uc801 \ud398\uc774\uc9c0\ub97c \uc5c5\ub370\uc774\ud2b8\ud560 \uc218 \uc788\uc5b4\uc694.",tip:"ISR = Incremental Static Regeneration. revalidate \uc635\uc158\uc73c\ub85c \uc124\uc815\ud574\uc694"},
    {en:"The server component is fetching data that changes frequently. Consider using revalidate with a short interval.",es:"El componente de servidor est\u00e1 obteniendo datos que cambian con frecuencia. Considera usar revalidate con un intervalo corto.",ko:"\uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8\uac00 \uc790\uc8fc \ubcc0\uacbd\ub418\ub294 \ub370\uc774\ud130\ub97c \uac00\uc838\uc624\uace0 \uc788\uc5b4\uc694. \uc9e7\uc740 \uac04\uaca9\uc73c\ub85c revalidate \uc0ac\uc6a9\uc744 \uace0\ub824\ud574\uc694.",tip:"export const revalidate = 60 \uc73c\ub85c 60\ucd08\ub9c8\ub2e4 \ud398\uc774\uc9c0\ub97c \uc7ac\uc0dd\uc131\ud574\uc694"},
    {en:"Use startTransition to wrap non-urgent state updates so React can prioritize more important updates.",es:"Usa startTransition para envolver actualizaciones de estado no urgentes para que React pueda priorizar actualizaciones m\u00e1s importantes.",ko:"React\uac00 \ub354 \uc911\uc694\ud55c \uc5c5\ub370\uc774\ud2b8\ub97c \uc6b0\uc120\ud560 \uc218 \uc788\ub3c4\ub85d \uae34\uae09\ud558\uc9c0 \uc54a\uc740 \uc0c1\ud0dc \uc5c5\ub370\uc774\ud2b8\ub97c startTransition\uc73c\ub85c \uac10\uc2f8\uc694.",tip:"React 18\uc758 Concurrent Mode\uc5d0\uc11c \uc5c5\ub370\uc774\ud2b8 \uc6b0\uc120\uc21c\uc704\ub97c \uc81c\uc5b4\ud558\ub294 \ubc29\ubc95\uc774\uc5d0\uc694"},
    {en:"The loading.tsx file will automatically show while the page is loading in the App Router.",es:"El archivo loading.tsx se mostrar\u00e1 autom\u00e1ticamente mientras la p\u00e1gina se carga en el App Router.",ko:"loading.tsx \ud30c\uc77c\uc740 App Router\uc5d0\uc11c \ud398\uc774\uc9c0\uac00 \ub85c\ub529\ub418\ub294 \ub3d9\uc548 \uc790\ub3d9\uc73c\ub85c \ud45c\uc2dc\ub3fc\uc694.",tip:"Next.js 13+ App Router\uc5d0\uc11c loading.tsx\ub294 Suspense \uacbd\uacc4\ub97c \uc790\ub3d9\uc73c\ub85c \uc0dd\uc131\ud574\uc694"},
    {en:"The error.tsx file must be a Client Component \u2014 add the 'use client' directive at the top.",es:"El archivo error.tsx debe ser un Componente Cliente \u2014 agrega la directiva 'use client' en la parte superior.",ko:"error.tsx \ud30c\uc77c\uc740 \ud074\ub77c\uc774\uc5b8\ud2b8 \ucef4\ud3ec\ub10c\ud2b8\uc5ec\uc57c \ud574\uc694 \u2014 \ub9e8 \uc704\uc5d0 'use client' \uc9c0\uc2dc\uc5b4\ub97c \ucd94\uac00\ud574\uc694.",tip:"Next.js error boundary\ub294 useState\ub97c \uc0ac\uc6a9\ud558\uae30 \ub54c\ubb38\uc5d0 \ud074\ub77c\uc774\uc5b8\ud2b8 \ucef4\ud3ec\ub10c\ud2b8\uc5ec\uc57c \ud574\uc694"},
    {en:"useFormState and useFormStatus are new React 19 hooks for managing form state with Server Actions.",es:"useFormState y useFormStatus son nuevos hooks de React 19 para gestionar el estado del formulario con Server Actions.",ko:"useFormState\uc640 useFormStatus\ub294 \uc11c\ubc84 \uc561\uc158\uc73c\ub85c \ud3fc \uc0c1\ud0dc\ub97c \uad00\ub9ac\ud558\ub294 React 19\uc758 \uc0c8 \ud6c5\uc774\uc5d0\uc694.",tip:"Server Actions + useFormState \uc870\ud569\uc740 \ud480\uc2a4\ud0dd \ud3fc \ucc98\ub9ac\ub97c \ub2e8\uc21c\ud654\ud574\uc694"},
    {en:"The intercepting route allows you to show a modal while keeping the current page in the background.",es:"La ruta de intercepci\u00f3n te permite mostrar un modal mientras mantienes la p\u00e1gina actual en segundo plano.",ko:"\uc778\ud130\uc149\ud305 \ub77c\uc6b0\ud2b8\ub294 \ud604\uc7ac \ud398\uc774\uc9c0\ub97c \ubc30\uacbd\uc5d0 \uc720\uc9c0\ud558\uba74\uc11c \ubaa8\ub2ec\uc744 \ud45c\uc2dc\ud560 \uc218 \uc788\uac8c \ud574\uc694.",tip:"Next.js 13+\uc758 (..) \ud3f4\ub354 \ubb38\ubc95\uc73c\ub85c \uc778\ud130\uc149\ud305 \ub77c\uc6b0\ud2b8\ub97c \uad6c\ud604\ud574\uc694"},
    {en:"Suspense boundaries help you show a loading state for just part of the UI without blocking the rest of the page.",es:"Los l\u00edmites de Suspense te ayudan a mostrar un estado de carga solo para una parte de la interfaz sin bloquear el resto de la p\u00e1gina.",ko:"Suspense \uacbd\uacc4\ub294 \ud398\uc774\uc9c0\uc758 \ub098\uba38\uc9c0 \ubd80\ubd84\uc744 \ucc28\ub2e8\ud558\uc9c0 \uc54a\uace0 UI\uc758 \uc77c\ubd80\ub9cc \ub85c\ub529 \uc0c1\ud0dc\ub97c \ud45c\uc2dc\ud560 \uc218 \uc788\uac8c \ud574\uc694.",tip:"Suspense\ub294 \ucef4\ud3ec\ub10c\ud2b8 \ud2b8\ub9ac\uc758 \uc77c\ubd80\ub97c \ube44\ub3d9\uae30\uc801\uc73c\ub85c \ub80c\ub354\ub9c1\ud558\ub294 \uba54\ucee4\ub2c8\uc998\uc774\uc5d0\uc694"},
    {en:"The route handler replaces the API routes from the pages directory. Use it to handle HTTP methods.",es:"El manejador de rutas reemplaza las rutas de API del directorio pages. \u00dasalo para manejar m\u00e9todos HTTP.",ko:"\ub77c\uc6b0\ud2b8 \ud578\ub4e4\ub7ec\ub294 pages \ub514\ub809\ud1a0\ub9ac\uc758 API \ub77c\uc6b0\ud2b8\ub97c \ub300\uccb4\ud574\uc694. HTTP \uba54\uc11c\ub4dc\ub97c \ucc98\ub9ac\ud558\ub294 \ub370 \uc0ac\uc6a9\ud574\uc694.",tip:"App Router\uc5d0\uc11c route.ts \ud30c\uc77c\uc774 API routes \uc5ed\ud560\uc744 \ud574\uc694"},
    {en:"Avoid putting data fetching logic directly in components \u2014 use a data layer or custom hooks for better separation.",es:"Evita poner la l\u00f3gica de obtenci\u00f3n de datos directamente en los componentes \u2014 usa una capa de datos o hooks personalizados para mejor separaci\u00f3n.",ko:"\ucef4\ud3ec\ub10c\ud2b8\uc5d0 \uc9c1\uc811 \ub370\uc774\ud130 \ud328\uce6d \ub85c\uc9c1\uc744 \ub123\uc9c0 \ub9d0\uc544\uc694 \u2014 \ub354 \ub098\uc740 \ubd84\ub9ac\ub97c \uc704\ud574 \ub370\uc774\ud130 \ub808\uc774\uc5b4\ub098 \ucee4\uc2a4\ud140 \ud6c5\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\ub370\uc774\ud130 \ud328\uce6d \ub85c\uc9c1\uc744 \ubd84\ub9ac\ud558\uba74 \ud14c\uc2a4\ud2b8\uc640 \uc7ac\uc0ac\uc6a9\uc774 \uc26c\uc6cc\uc838\uc694"},
    {en:"React.memo only does a shallow comparison of props. For deep objects, you may still get unnecessary re-renders.",es:"React.memo solo hace una comparaci\u00f3n superficial de props. Para objetos profundos, a\u00fan puedes obtener re-renderizados innecesarios.",ko:"React.memo\ub294 props\uc758 \uc595\uc740 \ube44\uad50\ub9cc \ud574\uc694. \uae4a\uc740 \uac1d\uccb4\uc758 \uacbd\uc6b0 \uc5ec\uc804\ud788 \ubd88\ud544\uc694\ud55c \ub9ac\ub80c\ub354\ub9c1\uc774 \ubc1c\uc0dd\ud560 \uc218 \uc788\uc5b4\uc694.",tip:"useMemo\ub85c \uac1d\uccb4\ub97c \uba54\ubaa8\uc774\uc988\ud558\uac70\ub098 \ucee4\uc2a4\ud140 \ube44\uad50 \ud568\uc218\ub97c React.memo\uc5d0 \uc804\ub2ec\ud574\uc694"},
    {en:"Using index.ts barrel files makes imports cleaner but can hurt tree-shaking in some bundlers.",es:"Usar archivos barrel index.ts hace las importaciones m\u00e1s limpias pero puede perjudicar el tree-shaking en algunos bundlers.",ko:"index.ts \ubc30\ub7f4 \ud30c\uc77c\uc744 \uc0ac\uc6a9\ud558\uba74 import\uac00 \uae54\ub054\ud574\uc9c0\uc9c0\ub9cc \uc77c\ubd80 \ubc88\ub4e4\ub7ec\uc5d0\uc11c tree-shaking\uc5d0 \uc601\ud5a5\uc744 \uc904 \uc218 \uc788\uc5b4\uc694.",tip:"\ubc30\ub7f4 \ud30c\uc77c = \uc5ec\ub7ec \ubaa8\ub4c8\uc744 \ud55c \uacf3\uc5d0\uc11c re-export\ud558\ub294 \ud30c\uc77c\uc774\uc5d0\uc694"},
    {en:"The layout.tsx wraps all pages in the same route segment \u2014 a good place to add shared UI like headers and sidebars.",es:"El layout.tsx envuelve todas las p\u00e1ginas en el mismo segmento de ruta \u2014 un buen lugar para agregar UI compartida como encabezados y barras laterales.",ko:"layout.tsx\ub294 \ub3d9\uc77c\ud55c \ub77c\uc6b0\ud2b8 \uc138\uadf8\uba3c\ud2b8\uc758 \ubaa8\ub4e0 \ud398\uc774\uc9c0\ub97c \uac10\uc2f8\uc694 \u2014 \ud5e4\ub354\ub098 \uc0ac\uc774\ub4dc\ubc14 \uac19\uc740 \uacf5\uc720 UI\ub97c \ucd94\uac00\ud558\uae30 \uc88b\uc740 \uacf3\uc774\uc5d0\uc694.",tip:"\uc911\ucca9 \ub808\uc774\uc544\uc6c3\uc73c\ub85c \ud398\uc774\uc9c0\ubcc4\ub85c \ub2e4\ub978 \ub808\uc774\uc544\uc6c3\uc744 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"next/font automatically optimizes fonts and removes external network requests for better performance and privacy.",es:"next/font optimiza autom\u00e1ticamente las fuentes y elimina las solicitudes de red externas para un mejor rendimiento y privacidad.",ko:"next/font\uc740 \uc790\ub3d9\uc73c\ub85c \ud3f0\ud2b8\ub97c \ucd5c\uc801\ud654\ud558\uace0 \ub354 \ub098\uc740 \uc131\ub2a5\uacfc \uac1c\uc778 \uc815\ubcf4\ub97c \uc704\ud574 \uc678\ubd80 \ub124\ud2b8\uc6cc\ud06c \uc694\uccad\uc744 \uc81c\uac70\ud574\uc694.",tip:"Google Fonts\ub97c next/font/google \uc73c\ub85c \uac00\uc838\uc624\uba74 \uc790\ub3d9\uc73c\ub85c \ucd5c\uc801\ud654\ub3fc\uc694"},
    {en:"The use() hook in React 19 lets you read the value of a Promise or Context directly inside a component.",es:"El hook use() en React 19 te permite leer el valor de una Promise o Context directamente dentro de un componente.",ko:"React 19\uc758 use() \ud6c5\uc740 \ucef4\ud3ec\ub10c\ud2b8 \ub0b4\ubd80\uc5d0\uc11c \uc9c1\uc811 Promise \ub610\ub294 Context\uc758 \uac12\uc744 \uc77d\uc744 \uc218 \uc788\uac8c \ud574\uc694.",tip:"use() = React 19\uc758 \uc0c8 \ud6c5\uc73c\ub85c \uc870\uac74\ubb38 \uc548\uc5d0\uc11c\ub3c4 \uc0ac\uc6a9\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"Avoid storing derived state in useState \u2014 compute it directly from the existing state or props instead.",es:"Evita almacenar estado derivado en useState \u2014 comp\u00fatalo directamente desde el estado o props existentes en su lugar.",ko:"useState\uc5d0 \ud30c\uc0dd \uc0c1\ud0dc\ub97c \uc800\uc7a5\ud558\uc9c0 \ub9d0\uc544\uc694 \u2014 \ub300\uc2e0 \uae30\uc874 \uc0c1\ud0dc\ub098 props\uc5d0\uc11c \uc9c1\uc811 \uacc4\uc0b0\ud574\uc694.",tip:"derived state = \ub2e4\ub978 \uc0c1\ud0dc\uc5d0\uc11c \uacc4\uc0b0\ud560 \uc218 \uc788\ub294 \uac12\uc774\uc5d0\uc694. \uc911\ubcf5 \uc0c1\ud0dc\ub294 \ubc84\uadf8\ub97c \ub9cc\ub4e4\uc5b4\uc694"},
    {en:"parallel data fetching in Server Components by declaring multiple async operations before awaiting them.",es:"Obtenci\u00f3n de datos en paralelo en Componentes del Servidor declarando m\u00faltiples operaciones as\u00edncronas antes de esperarlas.",ko:"\uc11c\ubc84 \ucef4\ud3ec\ub10c\ud2b8\uc5d0\uc11c \uc5ec\ub7ec \ube44\ub3d9\uae30 \uc791\uc5c5\uc744 await \uc804\uc5d0 \uc120\uc5b8\ud574\uc11c \ubcd1\ub82c \ub370\uc774\ud130 \ud328\uce6d\uc744 \ud574\uc694.",tip:"Promise.all([fetchA(), fetchB()]) \ub85c \ubcd1\ub82c \ud328\uce6d\ud558\uba74 \uc21c\ucc28 \ud328\uce6d\ubcf4\ub2e4 \ud6e8\uc52c \ube68\ub77c\uc694"},
    {en:"next/image handles lazy loading, WebP conversion, and responsive images automatically out of the box.",es:"next/image maneja la carga diferida, conversi\u00f3n WebP e im\u00e1genes responsivas autom\u00e1ticamente de forma predeterminada.",ko:"next/image\ub294 \uc9c0\uc5f0 \ub85c\ub529, WebP \ubcc0\ud658, \ubc18\uc751\ud615 \uc774\ubbf8\uc9c0\ub97c \uc790\ub3d9\uc73c\ub85c \ucc98\ub9ac\ud574\uc694.",tip:"next/image\ub97c \uc0ac\uc6a9\ud558\uba74 \uc774\ubbf8\uc9c0 \uc131\ub2a5 \ucd5c\uc801\ud654\ub97c \uc790\ub3d9\uc73c\ub85c \ud574\uacb0\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"The not-found.tsx file renders when a notFound() function is called or a route doesn't match.",es:"El archivo not-found.tsx se renderiza cuando se llama a la funci\u00f3n notFound() o una ruta no coincide.",ko:"not-found.tsx \ud30c\uc77c\uc740 notFound() \ud568\uc218\uac00 \ud638\ucd9c\ub418\uac70\ub098 \ub77c\uc6b0\ud2b8\uac00 \uc77c\uce58\ud558\uc9c0 \uc54a\uc744 \ub54c \ub80c\ub354\ub9c1\ub3fc\uc694.",tip:"notFound()\ub97c \ud638\ucd9c\ud558\uba74 404 \uc0c1\ud0dc \ucf54\ub4dc\uc640 \ud568\uaed8 not-found.tsx\uac00 \ud45c\uc2dc\ub3fc\uc694"},
    {en:"Avoid wrapping everything in a single large Provider \u2014 split context by concern to prevent unnecessary re-renders.",es:"Evita envolver todo en un solo Provider grande \u2014 divide el contexto por preocupaci\u00f3n para prevenir re-renderizados innecesarios.",ko:"\ubaa8\ub4e0 \uac83\uc744 \ud558\ub098\uc758 \ud070 Provider\ub85c \uac10\uc2f8\uc9c0 \ub9d0\uc544\uc694 \u2014 \ubd88\ud544\uc694\ud55c \ub9ac\ub80c\ub354\ub9c1\uc744 \ubc29\uc9c0\ud558\uae30 \uc704\ud574 \uad00\uc2ec\uc0ac\ubcc4\ub85c Context\ub97c \ubd84\ub9ac\ud574\uc694.",tip:"Context\uac00 \uc790\uc8fc \ubcc0\uacbd\ub418\uba74 \ubaa8\ub4e0 \uc18c\ube44\uc790\uac00 \ub9ac\ub80c\ub354\ub9c1\ub3fc\uc694. \uc791\uc740 \ub2e8\uc704\ub85c \ubd84\ub9ac\ud574\uc694"},
    {en:"The middleware.ts file runs at the Edge, before the request reaches the server \u2014 ideal for auth checks and redirects.",es:"El archivo middleware.ts se ejecuta en el Edge, antes de que la solicitud llegue al servidor \u2014 ideal para comprobaciones de autenticaci\u00f3n y redirecciones.",ko:"middleware.ts \ud30c\uc77c\uc740 Edge\uc5d0\uc11c \uc2e4\ud589\ub3fc\uc694, \uc694\uccad\uc774 \uc11c\ubc84\uc5d0 \ub3c4\ub2ec\ud558\uae30 \uc804\uc5d0 \u2014 \uc778\uc99d \uccb4\ud06c\uc640 \ub9ac\ub514\ub809\uc158\uc5d0 \uc774\uc0c1\uc801\uc774\uc5d0\uc694.",tip:"Edge = \uc0ac\uc6a9\uc790\uc640 \uac00\uae4c\uc6b4 CDN \uc11c\ubc84\uc5d0\uc11c \uc2e4\ud589\ub3fc\uc11c \ub9e4\uc6b0 \ube60\ub978 \uc751\ub2f5\uc774 \uac00\ub2a5\ud574\uc694"}

    {en:"Cache frequently accessed data to improve performance.",es:"Almacena en cach\u00e9 los datos de acceso frecuente para mejorar el rendimiento.",ko:"\uc131\ub2a5 \ud5a5\uc0c1\uc744 \uc704\ud574 \uc790\uc8fc \uc811\uadfc\ud558\ub294 \ub370\uc774\ud130\ub97c \uce90\uc2dc\ud574\uc694.",tip:"Redis\ub97c \uc778\uba54\ubaa8\ub9ac \uce90\uc2dc\ub85c \ub9ce\uc774 \uc0ac\uc6a9\ud574\uc694"},
    {en:"Use environment variables for sensitive configuration.",es:"Usa variables de entorno para la configuraci\u00f3n sensible.",ko:"\ubbfc\uac10\ud55c \uc124\uc815\uc5d0\ub294 \ud658\uacbd \ubcc0\uc218\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"API \ud0a4, DB \ube44\ubc00\ubc88\ud638\ub294 \uc808\ub300 \ucf54\ub4dc\uc5d0 \ud558\ub4dc\ucf54\ub529\ud558\uba74 \uc548 \ub3fc\uc694"},
    {en:"The request payload is too large.",es:"El payload de la solicitud es demasiado grande.",ko:"\uc694\uccad \ud398\uc774\ub85c\ub4dc\uac00 \ub108\ubb34 \ucee4\uc694.",tip:"413 Payload Too Large \uc5d0\ub7ec\uc608\uc694. \ud30c\uc77c \ud06c\uae30 \uc81c\ud55c\uc744 \uc124\uc815\ud574\uc694"},
    {en:"Implement graceful shutdown to handle in-flight requests.",es:"Implementa un apagado elegante para manejar solicitudes en vuelo.",ko:"\ucc98\ub9ac \uc911\uc778 \uc694\uccad\uc744 \ucc98\ub9ac\ud558\uae30 \uc704\ud574 Graceful Shutdown\uc744 \uad6c\ud604\ud574\uc694.",tip:"SIGTERM \uc2e0\ud638\ub97c \ubc1b\uc73c\uba74 \uc9c4\ud589 \uc911\uc778 \uc694\uccad\uc744 \uc644\ub8cc \ud6c4 \uc885\ub8cc\ud574\uc694"},
    {en:"Use connection pooling for database connections.",es:"Usa agrupaci\u00f3n de conexiones para las conexiones de base de datos.",ko:"\ub370\uc774\ud130\ubca0\uc774\uc2a4 \uc5f0\uacb0\uc5d0 \ucee4\ub125\uc158 \ud480\ub9c1\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\uc5f0\uacb0\uc744 \ub9e4\ubc88 \uc0c8\ub85c \ub9cc\ub4e4\uc9c0 \uc54a\uace0 \uc7ac\uc0ac\uc6a9\ud574\uc11c \uc131\ub2a5\uc744 \ub192\uc5ec\uc694"},
    {en:"Log the request ID for easier debugging.",es:"Registra el ID de solicitud para facilitar la depuraci\u00f3n.",ko:"\ub354 \uc26c\uc6b4 \ub514\ubc84\uae45\uc744 \uc704\ud574 \uc694\uccad ID\ub97c \ub85c\uae45\ud574\uc694.",tip:"\uac01 \uc694\uccad\uc5d0 \uace0\uc720 ID\ub97c \ubd99\uc774\uba74 \ub85c\uadf8 \ucd94\uc801\uc774 \uc26c\uc6cc\uc694"},
    {en:"This endpoint is versioned as /api/v2/",es:"Este endpoint tiene la versi\u00f3n /api/v2/",ko:"\uc774 \uc5d4\ub4dc\ud3ec\uc778\ud2b8\ub294 /api/v2/\ub85c \ubc84\uc804\uc774 \uc9c0\uc815\ub410\uc5b4\uc694.",tip:"API \ubc84\uc804 \uad00\ub9ac\ub85c \ud558\uc704 \ud638\ud658\uc131\uc744 \uc720\uc9c0\ud560 \uc218 \uc788\uc5b4\uc694"},

    {en:"The webhook payload should be verified with a secret.",es:"El payload del webhook debe verificarse con un secreto.",ko:"\uc6f9\ud6c5 \ud398\uc774\ub85c\ub4dc\ub294 \uc2dc\ud06c\ub9bf\uc73c\ub85c \uac80\uc99d\ud574\uc57c \ud574\uc694.",tip:"HMAC \uc11c\uba85\uc73c\ub85c \uc6f9\ud6c5\uc774 \uc62c\ubc14\ub978 \uc18c\uc2a4\uc5d0\uc11c \uc654\ub294\uc9c0 \ud655\uc778\ud574\uc694"},
    {en:"Implement retry logic for failed external API calls.",es:"Implementa l\u00f3gica de reintento para llamadas a API externas fallidas.",ko:"\uc2e4\ud328\ud55c \uc678\ubd80 API \ud638\ucd9c\uc5d0 \ub300\ud55c \uc7ac\uc2dc\ub3c4 \ub85c\uc9c1\uc744 \uad6c\ud604\ud574\uc694.",tip:"\uc9c0\uc218 \ubc31\uc624\ud504(exponential backoff)\ub85c \uc7ac\uc2dc\ub3c4 \uac04\uaca9\uc744 \ub298\ub824\uc694"},
    {en:"Use DTOs to validate and transform incoming data.",es:"Usa DTOs para validar y transformar los datos entrantes.",ko:"\ub4e4\uc5b4\uc624\ub294 \ub370\uc774\ud130\ub97c \uac80\uc99d\ud558\uace0 \ubcc0\ud658\ud558\uae30 \uc704\ud574 DTO\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"DTO = Data Transfer Object. NestJS\uc5d0\uc11c \ub9ce\uc774 \uc0ac\uc6a9\ud574\uc694"},
    {en:"This service is stateless and can be horizontally scaled.",es:"Este servicio no tiene estado y puede escalarse horizontalmente.",ko:"\uc774 \uc11c\ube44\uc2a4\ub294 \ubb34\uc0c1\ud0dc\uc774\uba70 \uc218\ud3c9 \ud655\uc7a5\uc774 \uac00\ub2a5\ud574\uc694.",tip:"stateless = \uc11c\ubc84\uac00 \ud074\ub77c\uc774\uc5b8\ud2b8 \uc0c1\ud0dc\ub97c \uc800\uc7a5\ud558\uc9c0 \uc54a\ub294\ub2e4\ub294 \ub73b\uc774\uc5d0\uc694"},
    {en:"Add a health check endpoint for monitoring.",es:"Agrega un endpoint de verificaci\u00f3n de salud para monitoreo.",ko:"\ubaa8\ub2c8\ud130\ub9c1\uc744 \uc704\ud55c \ud5ec\uc2a4\uccb4\ud06c \uc5d4\ub4dc\ud3ec\uc778\ud2b8\ub97c \ucd94\uac00\ud574\uc694.",tip:"/health \ub610\ub294 /ping \uc5d4\ub4dc\ud3ec\uc778\ud2b8\ub85c \uc11c\ubc84 \uc0c1\ud0dc\ub97c \ud655\uc778\ud574\uc694"},
    {en:"Use middleware for cross-cutting concerns.",es:"Usa middleware para preocupaciones transversales.",ko:"\uacf5\ud1b5 \uad00\uc2ec\uc0ac\uc5d0\ub294 \ubbf8\ub4e4\uc6e8\uc5b4\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\uc778\uc99d, \ub85c\uae45, \uc5d0\ub7ec \ucc98\ub9ac \uac19\uc740 \uacf5\ud1b5 \ub85c\uc9c1\uc744 \ubbf8\ub4e4\uc6e8\uc5b4\ub85c \ubd84\ub9ac\ud574\uc694"},
    {en:"The response should include a Content-Type header.",es:"La respuesta debe incluir un encabezado Content-Type.",ko:"\uc751\ub2f5\uc5d0\ub294 Content-Type \ud5e4\ub354\uac00 \ud3ec\ud568\ub418\uc5b4\uc57c \ud574\uc694.",tip:"application/json, text/html \ub4f1 \ud0c0\uc785\uc744 \uba85\uc2dc\ud574\uc694"},
    {en:"Implement CSRF protection for form submissions.",es:"Implementa protecci\u00f3n CSRF para el env\u00edo de formularios.",ko:"\ud3fc \uc81c\ucd9c\uc5d0 \ub300\ud55c CSRF \ubcf4\ud638\ub97c \uad6c\ud604\ud574\uc694.",tip:"CSRF = Cross-Site Request Forgery. \ud1a0\ud070 \ubc29\uc2dd\uc73c\ub85c \ubc29\uc5b4\ud574\uc694"},
    {en:"Use message queues for long-running tasks.",es:"Usa colas de mensajes para tareas de larga duraci\u00f3n.",ko:"\uc624\ub798 \uc2e4\ud589\ub418\ub294 \uc791\uc5c5\uc5d0\ub294 \uba54\uc2dc\uc9c0 \ud050\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"Bull, RabbitMQ, AWS SQS \uac19\uc740 \ud050\ub97c \uc0ac\uc6a9\ud574\uc694"},
    {en:"Never store passwords in plain text.",es:"Nunca almacenes contrase\u00f1as en texto plano.",ko:"\ube44\ubc00\ubc88\ud638\ub97c \ud3c9\ubb38\uc73c\ub85c \uc800\uc7a5\ud558\uba74 \uc808\ub300 \uc548 \ub3fc\uc694.",tip:"bcrypt\ub098 argon2\ub85c \ud574\uc2f1\ud574\uc11c \uc800\uc7a5\ud574\uc694"},
    {en:"The JWT token expires in 24 hours.",es:"El token JWT expira en 24 horas.",ko:"JWT \ud1a0\ud070\uc740 24\uc2dc\uac04 \ud6c4\uc5d0 \ub9cc\ub8cc\ub3fc\uc694.",tip:"\uc9e7\uc740 \ub9cc\ub8cc \uc2dc\uac04 + refresh token \ubc29\uc2dd\uc774 \uc548\uc804\ud574\uc694"},
    {en:"Use GZIP compression to reduce response size.",es:"Usa compresi\u00f3n GZIP para reducir el tama\u00f1o de la respuesta.",ko:"\uc751\ub2f5 \ud06c\uae30\ub97c \uc904\uc774\uae30 \uc704\ud574 GZIP \uc555\ucd95\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"Express\uc5d0\uc11c compression \ubbf8\ub4e4\uc6e8\uc5b4\ub85c \uc27d\uac8c \uc801\uc6a9\ud574\uc694"},
    {en:"Implement circuit breaker pattern for external services.",es:"Implementa el patr\u00f3n de disyuntor para servicios externos.",ko:"\uc678\ubd80 \uc11c\ube44\uc2a4\uc5d0 \ub300\ud55c \uc11c\ud0b7 \ube0c\ub808\uc774\ucee4 \ud328\ud134\uc744 \uad6c\ud604\ud574\uc694.",tip:"\uc678\ubd80 \uc11c\ube44\uc2a4 \uc7a5\uc560 \uc2dc \ube60\ub978 \uc2e4\ud328\ub85c \uc804\uccb4 \uc2dc\uc2a4\ud15c \ubcf4\ud638\ud574\uc694"},
    {en:"This API supports both JSON and XML responses.",es:"Esta API admite respuestas tanto en JSON como en XML.",ko:"\uc774 API\ub294 JSON\uacfc XML \uc751\ub2f5\uc744 \ubaa8\ub450 \uc9c0\uc6d0\ud574\uc694.",tip:"Accept \ud5e4\ub354\ub85c \uc751\ub2f5 \ud615\uc2dd\uc744 \uc694\uccad\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"Document your API using OpenAPI/Swagger.",es:"Documenta tu API usando OpenAPI/Swagger.",ko:"OpenAPI/Swagger\ub97c \uc0ac\uc6a9\ud574 API\ub97c \ubb38\uc11c\ud654\ud574\uc694.",tip:"Swagger UI\ub85c API\ub97c \uc2dc\uac01\uc801\uc73c\ub85c \ud14c\uc2a4\ud2b8\ud560 \uc218 \uc788\uc5b4\uc694"},
    {en:"Always sanitize user input before processing it \u2014 even from authenticated users who might be compromised.",es:"Siempre sanitiza la entrada del usuario antes de procesarla \u2014 incluso de usuarios autenticados que podr\u00edan estar comprometidos.",ko:"\ucc98\ub9ac\ud558\uae30 \uc804\uc5d0 \ud56d\uc0c1 \uc0ac\uc6a9\uc790 \uc785\ub825\uc744 sanitize\ud574\uc694 \u2014 \uc190\uc0c1\ub410\uc744 \uc218 \uc788\ub294 \uc778\uc99d\ub41c \uc0ac\uc6a9\uc790\uc5d0\uac8c\uc11c \uc628 \uac83\ub3c4 \ub9c8\ucc2c\uac00\uc9c0\uc608\uc694.",tip:"\uc785\ub825 sanitize = \uc545\uc758\uc801\uc778 \uc785\ub825\uc774 \uc2dc\uc2a4\ud15c\uc5d0 \uc601\ud5a5\uc744 \uc8fc\uc9c0 \ubabb\ud558\ub3c4\ub85d \uc815\uc81c\ud558\ub294 \uac83\uc774\uc5d0\uc694"},
    {en:"Use structured logging with a consistent format so logs can be parsed and analyzed by monitoring tools.",es:"Usa el registro estructurado con un formato consistente para que los registros puedan ser analizados por herramientas de monitoreo.",ko:"\ubaa8\ub2c8\ud130\ub9c1 \ub3c4\uad6c\uac00 \ub85c\uadf8\ub97c \ud30c\uc2f1\ud558\uace0 \ubd84\uc11d\ud560 \uc218 \uc788\ub3c4\ub85d \uc77c\uad00\ub41c \ud615\uc2dd\uc758 \uad6c\uc870\ud654\ub41c \ub85c\uae45\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"JSON \ud615\uc2dd\uc758 \uad6c\uc870\ud654\ub41c \ub85c\uadf8\ub294 ELK Stack\uc774\ub098 Datadog\uc73c\ub85c \ubd84\uc11d\ud558\uae30 \uc26c\uc6cc\uc694"},
    {en:"The API response should include the total count for paginated results so clients know how many pages there are.",es:"La respuesta de la API debe incluir el recuento total para los resultados paginados para que los clientes sepan cu\u00e1ntas p\u00e1ginas hay.",ko:"\ud074\ub77c\uc774\uc5b8\ud2b8\uac00 \ud398\uc774\uc9c0 \uc218\ub97c \uc54c \uc218 \uc788\ub3c4\ub85d API \uc751\ub2f5\uc5d0 \ud398\uc774\uc9c0\ub124\uc774\uc158\ub41c \uacb0\uacfc\uc758 \ucd1d \uac1c\uc218\ub97c \ud3ec\ud568\ud574\uc57c \ud574\uc694.",tip:"\ud398\uc774\uc9c0\ub124\uc774\uc158 \uc751\ub2f5\uc5d0\ub294 data, total, page, limit \ud544\ub4dc\ub97c \ud3ec\ud568\ud558\ub294 \uac83\uc774 \ud45c\uc900\uc774\uc5d0\uc694"},
    {en:"Implement an exponential backoff strategy for retrying failed database connections on startup.",es:"Implementa una estrategia de retroceso exponencial para reintentar las conexiones de base de datos fallidas al inicio.",ko:"\uc2dc\uc791 \uc2dc \uc2e4\ud328\ud55c \ub370\uc774\ud130\ubca0\uc774\uc2a4 \uc5f0\uacb0\uc744 \uc7ac\uc2dc\ub3c4\ud558\uae30 \uc704\ud55c \uc9c0\uc218 \ubc31\uc624\ud504 \uc804\ub7b5\uc744 \uad6c\ud604\ud574\uc694.",tip:"\uc9c0\uc218 \ubc31\uc624\ud504 = \uc7ac\uc2dc\ub3c4 \uac04\uaca9\uc744 1\ucd08, 2\ucd08, 4\ucd08, 8\ucd08 \ub4f1\uc73c\ub85c \ub298\ub9ac\ub294 \ubc29\uc2dd\uc774\uc5d0\uc694"},
    {en:"Use HTTPS everywhere \u2014 even for internal microservice communication \u2014 to prevent man-in-the-middle attacks.",es:"Usa HTTPS en todas partes \u2014 incluso para la comunicaci\u00f3n interna de microservicios \u2014 para prevenir ataques de intermediario.",ko:"\uc911\uac04\uc790 \uacf5\uaca9\uc744 \ubc29\uc9c0\ud558\uae30 \uc704\ud574 \ub0b4\ubd80 \ub9c8\uc774\ud06c\ub85c\uc11c\ube44\uc2a4 \ud1b5\uc2e0\uc744 \ud3ec\ud568\ud574 \ubaa8\ub4e0 \uacf3\uc5d0 HTTPS\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\ub0b4\ubd80 \uc11c\ube44\uc2a4 \uac04 \ud1b5\uc2e0\ub3c4 \uc554\ud638\ud654\ud558\ub294 \uac83\uc774 zero-trust \ubcf4\uc548 \ubaa8\ub378\uc774\uc5d0\uc694"},
    {en:"The 204 No Content status code is appropriate for successful DELETE operations where no response body is needed.",es:"El c\u00f3digo de estado 204 Sin contenido es apropiado para operaciones DELETE exitosas donde no se necesita cuerpo de respuesta.",ko:"204 No Content \uc0c1\ud0dc \ucf54\ub4dc\ub294 \uc751\ub2f5 \ubcf8\ubb38\uc774 \ud544\uc694 \uc5c6\ub294 \uc131\uacf5\uc801\uc778 DELETE \uc791\uc5c5\uc5d0 \uc801\ud569\ud574\uc694.",tip:"HTTP \uc0c1\ud0dc \ucf54\ub4dc\ub97c \uc62c\ubc14\ub974\uac8c \uc0ac\uc6a9\ud558\uba74 API \uc18c\ube44\uc790\uac00 \uacb0\uacfc\ub97c \uc27d\uac8c \uc774\ud574\ud574\uc694"},
    {en:"Add request tracing so you can follow a single request through all microservices using a correlation ID.",es:"Agrega rastreo de solicitudes para que puedas seguir una sola solicitud a trav\u00e9s de todos los microservicios usando un ID de correlaci\u00f3n.",ko:"\uc0c1\uad00 \uad00\uacc4 ID\ub97c \uc0ac\uc6a9\ud574\uc11c \ubaa8\ub4e0 \ub9c8\uc774\ud06c\ub85c\uc11c\ube44\uc2a4\uc5d0\uc11c \ub2e8\uc77c \uc694\uccad\uc744 \ucd94\uc801\ud560 \uc218 \uc788\ub3c4\ub85d \uc694\uccad \ucd94\uc801\uc744 \ucd94\uac00\ud574\uc694.",tip:"correlation ID = \uc694\uccad\uc5d0 \ubd80\uc5ec\ud55c \uace0\uc720 ID\ub85c \ubd84\uc0b0 \uc2dc\uc2a4\ud15c\uc5d0\uc11c \ub85c\uadf8\ub97c \ucd94\uc801\ud574\uc694"},
    {en:"Validate the Content-Type header to ensure clients are sending data in the expected format.",es:"Valida el encabezado Content-Type para asegurarte de que los clientes est\u00e9n enviando datos en el formato esperado.",ko:"\ud074\ub77c\uc774\uc5b8\ud2b8\uac00 \uc608\uc0c1\ud55c \ud615\uc2dd\uc73c\ub85c \ub370\uc774\ud130\ub97c \ubcf4\ub0b4\uace0 \uc788\ub294\uc9c0 \ud655\uc778\ud558\uae30 \uc704\ud574 Content-Type \ud5e4\ub354\ub97c \uac80\uc99d\ud574\uc694.",tip:"\uc798\ubabb\ub41c Content-Type\uc740 \ub370\uc774\ud130 \ud30c\uc2f1 \uc624\ub958\uc758 \uc6d0\uc778\uc774\uc5d0\uc694"},
    {en:"Use database transactions for operations that modify multiple tables to ensure data consistency.",es:"Usa transacciones de base de datos para operaciones que modifican m\u00faltiples tablas para asegurar la consistencia de los datos.",ko:"\ub370\uc774\ud130 \uc77c\uad00\uc131\uc744 \ubcf4\uc7a5\ud558\uae30 \uc704\ud574 \uc5ec\ub7ec \ud14c\uc774\ube14\uc744 \uc218\uc815\ud558\ub294 \uc791\uc5c5\uc5d0 \ub370\uc774\ud130\ubca0\uc774\uc2a4 \ud2b8\ub79c\uc7ad\uc158\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\ud2b8\ub79c\uc7ad\uc158\uc740 \ubaa8\ub450 \uc131\uacf5\ud558\uac70\ub098 \ubaa8\ub450 \uc2e4\ud328\ud558\ub294 \uc6d0\uc790\uc131\uc744 \ubcf4\uc7a5\ud574\uc694"},
    {en:"The API gateway should handle cross-cutting concerns like authentication, rate limiting, and logging centrally.",es:"El gateway de API debe manejar preocupaciones transversales como autenticaci\u00f3n, limitaci\u00f3n de velocidad y registro de forma centralizada.",ko:"API \uac8c\uc774\ud2b8\uc6e8\uc774\ub294 \uc778\uc99d, \uc18d\ub3c4 \uc81c\ud55c, \ub85c\uae45 \uac19\uc740 \uacf5\ud1b5 \uad00\uc2ec\uc0ac\ub97c \uc911\uc559\uc5d0\uc11c \ucc98\ub9ac\ud574\uc57c \ud574\uc694.",tip:"API \uac8c\uc774\ud2b8\uc6e8\uc774 = \ubaa8\ub4e0 API \uc694\uccad\uc758 \ub2e8\uc77c \uc9c4\uc785\uc810\uc774\uc5d0\uc694"},
    {en:"Implement graceful degradation \u2014 when a non-critical service fails, return partial data rather than failing entirely.",es:"Implementa la degradaci\u00f3n elegante \u2014 cuando falla un servicio no cr\u00edtico, devuelve datos parciales en lugar de fallar completamente.",ko:"\uc6b0\uc544\ud55c \uc800\ud558\ub97c \uad6c\ud604\ud574\uc694 \u2014 \uc911\uc694\ud558\uc9c0 \uc54a\uc740 \uc11c\ube44\uc2a4\uac00 \uc2e4\ud328\ud558\uba74 \uc644\uc804\ud788 \uc2e4\ud328\ud558\ub294 \ub300\uc2e0 \ubd80\ubd84\uc801\uc778 \ub370\uc774\ud130\ub97c \ubc18\ud658\ud574\uc694.",tip:"graceful degradation = \uc77c\ubd80 \uae30\ub2a5\uc774 \uc2e4\ud328\ud574\ub3c4 \ud575\uc2ec \uae30\ub2a5\uc740 \ub3d9\uc791\ud558\ub294 \uc124\uacc4\uc608\uc694"},
    {en:"Never return sensitive fields like passwords or tokens in API responses \u2014 use a serializer to filter the output.",es:"Nunca devuelvas campos sensibles como contrase\u00f1as o tokens en las respuestas de la API \u2014 usa un serializador para filtrar la salida.",ko:"API \uc751\ub2f5\uc5d0\uc11c \ube44\ubc00\ubc88\ud638\ub098 \ud1a0\ud070 \uac19\uc740 \ubbfc\uac10\ud55c \ud544\ub4dc\ub97c \ubc18\ud658\ud558\uc9c0 \ub9d0\uc544\uc694 \u2014 \ucd9c\ub825\uc744 \ud544\ud130\ub9c1\ud558\uae30 \uc704\ud574 \uc9c1\ub82c\ud654\uae30\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\uc751\ub2f5 \uac1d\uccb4\uc5d0\uc11c \ubbfc\uac10\ud55c \ud544\ub4dc\ub97c \uba85\uc2dc\uc801\uc73c\ub85c \uc81c\uc678\ud558\ub294 allowlist \ubc29\uc2dd\uc774 \uc548\uc804\ud574\uc694"},
    {en:"Use idempotency keys for payment and order creation APIs to safely retry failed requests.",es:"Usa claves de idempotencia para las APIs de creaci\u00f3n de pagos y pedidos para reintentar solicitudes fallidas de manera segura.",ko:"\uc2e4\ud328\ud55c \uc694\uccad\uc744 \uc548\uc804\ud558\uac8c \uc7ac\uc2dc\ub3c4\ud558\uae30 \uc704\ud574 \uacb0\uc81c \ubc0f \uc8fc\ubb38 \uc0dd\uc131 API\uc5d0 \uba71\ub4f1\uc131 \ud0a4\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"idempotency key = \uc911\ubcf5 \ucc98\ub9ac\ub97c \ubc29\uc9c0\ud558\uae30 \uc704\ud55c \uace0\uc720\ud55c \uc694\uccad \uc2dd\ubcc4\uc790\uc608\uc694"},
    {en:"Add a timeout to all external API calls \u2014 never allow a slow third-party service to block your server indefinitely.",es:"Agrega un tiempo de espera a todas las llamadas a API externas \u2014 nunca permitas que un servicio de terceros lento bloquee tu servidor indefinidamente.",ko:"\ubaa8\ub4e0 \uc678\ubd80 API \ud638\ucd9c\uc5d0 \ud0c0\uc784\uc544\uc6c3\uc744 \ucd94\uac00\ud574\uc694 \u2014 \ub290\ub9b0 \uc11c\ub4dc\ud30c\ud2f0 \uc11c\ube44\uc2a4\uac00 \uc11c\ubc84\ub97c \ubb34\uae30\ud55c \ucc28\ub2e8\ud558\ub3c4\ub85d \ud5c8\uc6a9\ud558\uc9c0 \ub9c8\uc138\uc694.",tip:"\uc678\ubd80 API \ud0c0\uc784\uc544\uc6c3\uc744 5-30\ucd08 \uc815\ub3c4\ub85c \uc124\uc815\ud558\uace0 \ud0c0\uc784\uc544\uc6c3 \uc2dc \uc801\uc808\ud788 \ucc98\ub9ac\ud574\uc694"},
    {en:"The service should emit metrics for request count, latency, and error rate so they can be visualized on a dashboard.",es:"El servicio debe emitir m\u00e9tricas para el recuento de solicitudes, la latencia y la tasa de errores para que puedan visualizarse en un panel.",ko:"\uc694\uccad \uc218, \uc9c0\uc5f0 \uc2dc\uac04, \uc624\ub958\uc728\uc5d0 \ub300\ud55c \uba54\ud2b8\ub9ad\uc744 \ub300\uc2dc\ubcf4\ub4dc\uc5d0\uc11c \uc2dc\uac01\ud654\ud560 \uc218 \uc788\ub3c4\ub85d \uc11c\ube44\uc2a4\uac00 \uba54\ud2b8\ub9ad\uc744 \ubc1c\ud589\ud574\uc57c \ud574\uc694.",tip:"Prometheus + Grafana \uc870\ud569\uc774 \uba54\ud2b8\ub9ad \uc218\uc9d1\uacfc \uc2dc\uac01\ud654\uc758 \ud45c\uc900\uc774\uc5d0\uc694"},
    {en:"Soft-delete records instead of hard-deleting them \u2014 add a deleted_at timestamp to preserve data history.",es:"Elimina registros de forma suave en lugar de eliminarlos permanentemente \u2014 agrega una marca de tiempo deleted_at para preservar el historial de datos.",ko:"\ub370\uc774\ud130 \uae30\ub85d\uc744 \ubcf4\uc874\ud558\uae30 \uc704\ud574 \ud558\ub4dc \uc0ad\uc81c \ub300\uc2e0 \uc18c\ud504\ud2b8 \uc0ad\uc81c \ub808\ucf54\ub4dc\ub97c \uc0ac\uc6a9\ud574\uc694 \u2014 deleted_at \ud0c0\uc784\uc2a4\ud0ec\ud504\ub97c \ucd94\uac00\ud574\uc694.",tip:"\uc18c\ud504\ud2b8 \uc0ad\uc81c\ub294 \ub370\uc774\ud130 \ubcf5\uad6c\uc640 \uac10\uc0ac(audit) \ub85c\uadf8\uc5d0 \uc720\uc6a9\ud574\uc694"},
    {en:"Implement request deduplication to prevent duplicate operations when clients retry failed requests.",es:"Implementa la deduplicaci\u00f3n de solicitudes para prevenir operaciones duplicadas cuando los clientes reintentan solicitudes fallidas.",ko:"\ud074\ub77c\uc774\uc5b8\ud2b8\uac00 \uc2e4\ud328\ud55c \uc694\uccad\uc744 \uc7ac\uc2dc\ub3c4\ud560 \ub54c \uc911\ubcf5 \uc791\uc5c5\uc744 \ubc29\uc9c0\ud558\uae30 \uc704\ud574 \uc694\uccad \uc911\ubcf5 \uc81c\uac70\ub97c \uad6c\ud604\ud574\uc694.",tip:"Redis\ub85c \ucd5c\uadfc \ucc98\ub9ac\ud55c \uc694\uccad ID\ub97c \uce90\uc2dc\ud574\uc11c \uc911\ubcf5\uc744 \uac10\uc9c0\ud574\uc694"},
    {en:"Use pagination for all list endpoints \u2014 never return an unbounded list that could contain millions of records.",es:"Usa paginaci\u00f3n para todos los endpoints de lista \u2014 nunca devuelvas una lista sin l\u00edmite que podr\u00eda contener millones de registros.",ko:"\ubaa8\ub4e0 \ubaa9\ub85d \uc5d4\ub4dc\ud3ec\uc778\ud2b8\uc5d0 \ud398\uc774\uc9c0\ub124\uc774\uc158\uc744 \uc0ac\uc6a9\ud574\uc694 \u2014 \uc218\ubc31\ub9cc \uac1c\uc758 \ub808\ucf54\ub4dc\ub97c \ud3ec\ud568\ud560 \uc218 \uc788\ub294 \ubb34\ud55c \ubaa9\ub85d\uc744 \ubc18\ud658\ud558\uc9c0 \ub9c8\uc138\uc694.",tip:"\uae30\ubcf8 limit\uc744 20-100 \uc0ac\uc774\ub85c \uc124\uc815\ud558\uace0 \ucd5c\ub300 limit\ub3c4 \uc81c\ud55c\ud574\uc694"},
    {en:"The 429 Too Many Requests response should include a Retry-After header so clients know when to try again.",es:"La respuesta 429 Demasiadas solicitudes debe incluir un encabezado Retry-After para que los clientes sepan cu\u00e1ndo volver a intentarlo.",ko:"429 Too Many Requests \uc751\ub2f5\uc5d0\ub294 \ud074\ub77c\uc774\uc5b8\ud2b8\uac00 \uc5b8\uc81c \ub2e4\uc2dc \uc2dc\ub3c4\ud560\uc9c0 \uc54c \uc218 \uc788\ub3c4\ub85d Retry-After \ud5e4\ub354\ub97c \ud3ec\ud568\ud574\uc57c \ud574\uc694.",tip:"Retry-After \ud5e4\ub354 \uac12\uc740 \ucd08 \ub2e8\uc704 \ub610\ub294 HTTP \ub0a0\uc9dc \ud615\uc2dd\uc774\uc5d0\uc694"},
    {en:"Consider using optimistic locking with a version field to handle concurrent updates to the same resource.",es:"Considera usar el bloqueo optimista con un campo de versi\u00f3n para manejar actualizaciones concurrentes al mismo recurso.",ko:"\ub3d9\uc77c\ud55c \ub9ac\uc18c\uc2a4\uc5d0 \ub300\ud55c \ub3d9\uc2dc \uc5c5\ub370\uc774\ud2b8\ub97c \ucc98\ub9ac\ud558\uae30 \uc704\ud574 version \ud544\ub4dc\ub85c \ub099\uad00\uc801 \uc7a0\uae08 \uc0ac\uc6a9\uc744 \uace0\ub824\ud574\uc694.",tip:"\ub099\uad00\uc801 \uc7a0\uae08 = \ucda9\ub3cc\uc774 \ub4dc\ubb3c\ub2e4\uace0 \uac00\uc815\ud558\uace0 \ucda9\ub3cc \uc2dc\uc5d0\ub9cc \ucc98\ub9ac\ud558\ub294 \ubc29\uc2dd\uc774\uc5d0\uc694"}
  ],
  [ // 9: 데이터베이스
    {en:"Use an index to speed up query performance.",es:"Usa un \u00edndice para acelerar el rendimiento de las consultas.",ko:"\ucffc\ub9ac \uc131\ub2a5\uc744 \ub192\uc774\uae30 \uc704\ud574 \uc778\ub371\uc2a4\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\uc790\uc8fc \uac80\uc0c9\ud558\ub294 \uceec\ub7fc\uc5d0 \uc778\ub371\uc2a4\ub97c \ucd94\uac00\ud558\uba74 \uc18d\ub3c4\uac00 \ube68\ub77c\uc838\uc694"},
    {en:"Avoid SELECT * in production queries.",es:"Evita SELECT * en consultas de producci\u00f3n.",ko:"\uc6b4\uc601 \ucffc\ub9ac\uc5d0\uc11c SELECT *\uc744 \ud53c\ud574\uc694.",tip:"\ud544\uc694\ud55c \uceec\ub7fc\ub9cc \uc120\ud0dd\ud558\uba74 \ub124\ud2b8\uc6cc\ud06c \ube44\uc6a9\uc774 \uc904\uc5b4\uc694"},
    {en:"Use transactions to ensure data consistency.",es:"Usa transacciones para garantizar la consistencia de los datos.",ko:"\ub370\uc774\ud130 \uc77c\uad00\uc131\uc744 \ubcf4\uc7a5\ud558\uae30 \uc704\ud574 \ud2b8\ub79c\uc7ad\uc158\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"ACID \ud2b9\uc131: \uc6d0\uc790\uc131, \uc77c\uad00\uc131, \uaca9\ub9ac\uc131, \uc9c0\uc18d\uc131\uc774\uc5d0\uc694"},
    {en:"This query has an N+1 problem.",es:"Esta consulta tiene un problema N+1.",ko:"\uc774 \ucffc\ub9ac\uc5d0\ub294 N+1 \ubb38\uc81c\uac00 \uc788\uc5b4\uc694.",tip:"JOIN\uc774\ub098 eager loading\uc73c\ub85c N+1 \ubb38\uc81c\ub97c \ud574\uacb0\ud574\uc694"},
    {en:"Add a NOT NULL constraint to required columns.",es:"Agrega una restricci\u00f3n NOT NULL a las columnas requeridas.",ko:"\ud544\uc218 \uceec\ub7fc\uc5d0 NOT NULL \uc81c\uc57d \uc870\uac74\uc744 \ucd94\uac00\ud574\uc694.",tip:"NULL\uc774 \ub4e4\uc5b4\uc624\uba74 \uc548 \ub418\ub294 \uceec\ub7fc\uc744 \ubcf4\ud638\ud574\uc694"},
    {en:"Use parameterized queries to prevent SQL injection.",es:"Usa consultas parametrizadas para prevenir la inyecci\u00f3n SQL.",ko:"SQL \uc778\uc81d\uc158\uc744 \ubc29\uc9c0\ud558\uae30 \uc704\ud574 \ud30c\ub77c\ubbf8\ud130\ud654\ub41c \ucffc\ub9ac\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\uc0ac\uc6a9\uc790 \uc785\ub825\uc744 \uc9c1\uc811 \ucffc\ub9ac\uc5d0 \ub123\uc73c\uba74 \uc808\ub300 \uc548 \ub3fc\uc694!"},
    {en:"Create a composite index for frequently used column combinations.",es:"Crea un \u00edndice compuesto para combinaciones de columnas de uso frecuente.",ko:"\uc790\uc8fc \uc0ac\uc6a9\ud558\ub294 \uceec\ub7fc \uc870\ud569\uc5d0 \ubcf5\ud569 \uc778\ub371\uc2a4\ub97c \ub9cc\ub4e4\uc5b4\uc694.",tip:"WHERE a = 1 AND b = 2 \ucffc\ub9ac\uc5d0\ub294 (a, b) \ubcf5\ud569 \uc778\ub371\uc2a4\uac00 \ud6a8\uc728\uc801\uc774\uc5d0\uc694"},
    {en:"Run EXPLAIN to analyze query execution plan.",es:"Ejecuta EXPLAIN para analizar el plan de ejecuci\u00f3n de consultas.",ko:"\ucffc\ub9ac \uc2e4\ud589 \uacc4\ud68d\uc744 \ubd84\uc11d\ud558\ub824\uba74 EXPLAIN\uc744 \uc2e4\ud589\ud574\uc694.",tip:"\ub290\ub9b0 \ucffc\ub9ac\ub97c \ucd5c\uc801\ud654\ud560 \ub54c EXPLAIN ANALYZE\uac00 \ud544\uc218\uc608\uc694"},
    {en:"Normalize the database to reduce redundancy.",es:"Normaliza la base de datos para reducir la redundancia.",ko:"\uc911\ubcf5\uc131\uc744 \uc904\uc774\uae30 \uc704\ud574 \ub370\uc774\ud130\ubca0\uc774\uc2a4\ub97c \uc815\uaddc\ud654\ud574\uc694.",tip:"1NF, 2NF, 3NF \uc815\uaddc\ud654 \ub2e8\uacc4\ub85c \ub370\uc774\ud130 \uc911\ubcf5\uc744 \uc5c6\uc560\uc694"},
    {en:"Use soft delete instead of hard delete.",es:"Usa eliminaci\u00f3n suave en lugar de eliminaci\u00f3n definitiva.",ko:"\ud558\ub4dc \uc0ad\uc81c \ub300\uc2e0 \uc18c\ud504\ud2b8 \uc0ad\uc81c\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"deleted_at \uceec\ub7fc\uc5d0 \uc2dc\uac04\uc744 \uae30\ub85d\ud558\ub294 \ubc29\uc2dd\uc774\uc5d0\uc694"},
    {en:"Add a created_at and updated_at timestamp to every table.",es:"Agrega una marca de tiempo created_at y updated_at a cada tabla.",ko:"\ubaa8\ub4e0 \ud14c\uc774\ube14\uc5d0 created_at\uacfc updated_at \ud0c0\uc784\uc2a4\ud0ec\ud504\ub97c \ucd94\uac00\ud574\uc694.",tip:"\ub370\uc774\ud130 \uc0dd\uc131/\uc218\uc815 \uc2dc\uac04\uc744 \ucd94\uc801\ud558\ub294 \ub370 \ud544\uc218\uc608\uc694"},
    {en:"Foreign key constraints maintain referential integrity.",es:"Las restricciones de clave for\u00e1nea mantienen la integridad referencial.",ko:"\uc678\ub798 \ud0a4 \uc81c\uc57d \uc870\uac74\uc740 \ucc38\uc870 \ubb34\uacb0\uc131\uc744 \uc720\uc9c0\ud574\uc694.",tip:"\ubd80\ubaa8 \ub808\ucf54\ub4dc \uc5c6\uc774 \uc790\uc2dd \ub808\ucf54\ub4dc\uac00 \uc0dd\uae30\ub294 \uac83\uc744 \ubc29\uc9c0\ud574\uc694"},
    {en:"Use connection pooling to manage database connections efficiently.",es:"Usa agrupaci\u00f3n de conexiones para administrar las conexiones de base de datos de manera eficiente.",ko:"\ub370\uc774\ud130\ubca0\uc774\uc2a4 \uc5f0\uacb0\uc744 \ud6a8\uc728\uc801\uc73c\ub85c \uad00\ub9ac\ud558\ub824\uba74 \ucee4\ub125\uc158 \ud480\ub9c1\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\ub9e4\ubc88 \uc0c8 \uc5f0\uacb0\uc744 \ub9cc\ub4e4\uba74 \uc624\ubc84\ud5e4\ub4dc\uac00 \ucee4\uc694"},
    {en:"Back up your database regularly.",es:"Haz copias de seguridad de tu base de datos regularmente.",ko:"\uc815\uae30\uc801\uc73c\ub85c \ub370\uc774\ud130\ubca0\uc774\uc2a4\ub97c \ubc31\uc5c5\ud574\uc694.",tip:"\uc790\ub3d9 \ubc31\uc5c5 \uc2a4\ucf00\uc904\uc744 \uc124\uc815\ud558\uace0 \ubcf5\uad6c \ud14c\uc2a4\ud2b8\ub3c4 \ud574\uc694"},
    {en:"Use UUID instead of auto-increment for distributed systems.",es:"Usa UUID en lugar de auto-incremento para sistemas distribuidos.",ko:"\ubd84\uc0b0 \uc2dc\uc2a4\ud15c\uc5d0\uc11c\ub294 \uc790\ub3d9 \uc99d\uac00 \ub300\uc2e0 UUID\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"\uc5ec\ub7ec DB \uc11c\ubc84\uc5d0\uc11c ID \ucda9\ub3cc\uc744 \ubc29\uc9c0\ud574\uc694"},
    {en:"The UNIQUE constraint prevents duplicate values.",es:"La restricci\u00f3n UNIQUE evita valores duplicados.",ko:"UNIQUE \uc81c\uc57d \uc870\uac74\uc740 \uc911\ubcf5 \uac12\uc744 \ubc29\uc9c0\ud574\uc694.",tip:"\uc774\uba54\uc77c, \uc804\ud654\ubc88\ud638 \uac19\uc740 \uace0\uc720\ud574\uc57c \ud558\ub294 \uceec\ub7fc\uc5d0 \uc0ac\uc6a9\ud574\uc694"},
    {en:"Use LIMIT and OFFSET for pagination.",es:"Usa LIMIT y OFFSET para la paginaci\u00f3n.",ko:"\ud398\uc774\uc9c0\ub124\uc774\uc158\uc744 \uc704\ud574 LIMIT\uacfc OFFSET\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\ub370\uc774\ud130\uac00 \ub9ce\uc744 \ub54c cursor \uae30\ubc18 \ud398\uc774\uc9c0\ub124\uc774\uc158\uc774 \ub354 \ud6a8\uc728\uc801\uc774\uc5d0\uc694"},
    {en:"Denormalize for read performance when needed.",es:"Desnormaliza para el rendimiento de lectura cuando sea necesario.",ko:"\ud544\uc694\ud560 \ub54c \uc77d\uae30 \uc131\ub2a5\uc744 \uc704\ud574 \ube44\uc815\uaddc\ud654\ud574\uc694.",tip:"\uc815\uaddc\ud654\uc640 \uc131\ub2a5 \uc0ac\uc774\uc758 \ud2b8\ub808\uc774\ub4dc\uc624\ud504\ub97c \uace0\ub824\ud574\uc694"},
    {en:"This table has a one-to-many relationship.",es:"Esta tabla tiene una relaci\u00f3n uno a muchos.",ko:"\uc774 \ud14c\uc774\ube14\uc740 \uc77c\ub300\ub2e4 \uad00\uacc4\ub97c \uac00\uc838\uc694.",tip:"\uc0ac\uc6a9\uc790 \ud55c \uba85\uc774 \uc5ec\ub7ec \uac8c\uc2dc\uae00\uc744 \uac00\uc9c8 \uc218 \uc788\ub294 \uad00\uacc4\uc608\uc694"},
    {en:"Use a migration tool to track schema changes.",es:"Usa una herramienta de migraci\u00f3n para rastrear los cambios de esquema.",ko:"\uc2a4\ud0a4\ub9c8 \ubcc0\uacbd\uc744 \ucd94\uc801\ud558\uae30 \uc704\ud574 \ub9c8\uc774\uadf8\ub808\uc774\uc158 \ub3c4\uad6c\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"Flyway, Liquibase, Prisma Migrate \ub4f1\uc744 \uc0ac\uc6a9\ud574\uc694"},
    {en:"Index the foreign key columns.",es:"Indexa las columnas de clave for\u00e1nea.",ko:"\uc678\ub798 \ud0a4 \uceec\ub7fc\uc5d0 \uc778\ub371\uc2a4\ub97c \ucd94\uac00\ud574\uc694.",tip:"JOIN \uc2dc \uc678\ub798 \ud0a4\uc5d0 \uc778\ub371\uc2a4\uac00 \uc5c6\uc73c\uba74 \ub9e4\uc6b0 \ub290\ub824\uc838\uc694"},
    {en:"Avoid locking issues with optimistic concurrency control.",es:"Evita problemas de bloqueo con control de concurrencia optimista.",ko:"\ub099\uad00\uc801 \ub3d9\uc2dc\uc131 \uc81c\uc5b4\ub85c \uc7a0\uae08 \ubb38\uc81c\ub97c \ud53c\ud574\uc694.",tip:"version \uceec\ub7fc\uc73c\ub85c \ucda9\ub3cc\uc744 \uac10\uc9c0\ud558\ub294 \ubc29\uc2dd\uc774\uc5d0\uc694"},
    {en:"The query is doing a full table scan.",es:"La consulta est\u00e1 haciendo un escaneo completo de la tabla.",ko:"\ucffc\ub9ac\uac00 \ud480 \ud14c\uc774\ube14 \uc2a4\uce94\uc744 \ud558\uace0 \uc788\uc5b4\uc694.",tip:"\uc778\ub371\uc2a4\uac00 \uc5c6\uac70\ub098 \uc798\ubabb \uc124\uacc4\ub41c \ucffc\ub9ac\uc5d0\uc11c \ubc1c\uc0dd\ud574\uc694. \ub9e4\uc6b0 \ub290\ub824\uc694"},
    {en:"Use a read replica for read-heavy workloads.",es:"Usa una r\u00e9plica de lectura para cargas de trabajo de lectura intensiva.",ko:"\uc77d\uae30\uac00 \ub9ce\uc740 \uc6cc\ud06c\ub85c\ub4dc\uc5d0\ub294 \uc77d\uae30 \uc804\uc6a9 \ubcf5\uc81c\ubcf8\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"\ub9c8\uc2a4\ud130 DB\ub294 \uc4f0\uae30, \ub808\ud50c\ub9ac\uce74\ub294 \uc77d\uae30\ub85c \ubd80\ud558\ub97c \ubd84\uc0b0\ud574\uc694"},
    {en:"Partition large tables for better performance.",es:"Particiona tablas grandes para un mejor rendimiento.",ko:"\ub354 \ub098\uc740 \uc131\ub2a5\uc744 \uc704\ud574 \ud070 \ud14c\uc774\ube14\uc744 \ud30c\ud2f0\uc154\ub2dd\ud574\uc694.",tip:"\ub0a0\uc9dc \ubc94\uc704\ub098 \ud574\uc2dc\ub85c \ud30c\ud2f0\uc154\ub2dd\ud558\uba74 \ucffc\ub9ac \uc18d\ub3c4\uac00 \ube68\ub77c\uc838\uc694"},
    {en:"Use COALESCE to handle NULL values.",es:"Usa COALESCE para manejar valores NULL.",ko:"NULL \uac12\uc744 \ucc98\ub9ac\ud558\ub824\uba74 COALESCE\ub97c \uc0ac\uc6a9\ud574\uc694.",tip:"COALESCE(column, 'default') = NULL\uc774\uba74 'default'\ub97c \ubc18\ud658\ud574\uc694"},
    {en:"A deadlock occurred between two transactions.",es:"Ocurri\u00f3 un interbloqueo entre dos transacciones.",ko:"\ub450 \ud2b8\ub79c\uc7ad\uc158 \uc0ac\uc774\uc5d0\uc11c \ub370\ub4dc\ub77d\uc774 \ubc1c\uc0dd\ud588\uc5b4\uc694.",tip:"\ud2b8\ub79c\uc7ad\uc158\uc5d0\uc11c \uc7a0\uae08 \uc21c\uc11c\ub97c \uc77c\uad00\ub418\uac8c \uc720\uc9c0\ud558\uba74 \ubc29\uc9c0\ud560 \uc218 \uc788\uc5b4\uc694"},

    {en:"Avoid using SELECT * \u2014 always specify the columns you need to reduce data transfer and improve query clarity.",es:"Evita usar SELECT * \u2014 siempre especifica las columnas que necesitas para reducir la transferencia de datos y mejorar la claridad de la consulta.",ko:"SELECT *\ub97c \ud53c\ud574\uc694 \u2014 \ub370\uc774\ud130 \uc804\uc1a1\uc744 \uc904\uc774\uace0 \ucffc\ub9ac \uba85\ud655\uc131\uc744 \ub192\uc774\uae30 \uc704\ud574 \ud544\uc694\ud55c \uceec\ub7fc\uc744 \ud56d\uc0c1 \uba85\uc2dc\ud574\uc694.",tip:"\ud544\uc694\ud55c \uceec\ub7fc\ub9cc \uc120\ud0dd\ud558\uba74 \uc778\ub371\uc2a4 \ucee4\ubc84\ub9ac\uc9c0\ub3c4 \ub192\uc544\uc838\uc694"},

    {en:"Use database-level constraints instead of relying solely on application-level validation for data integrity.",es:"Usa restricciones a nivel de base de datos en lugar de depender \u00fanicamente de la validaci\u00f3n a nivel de aplicaci\u00f3n para la integridad de los datos.",ko:"\ub370\uc774\ud130 \ubb34\uacb0\uc131\uc744 \uc704\ud574 \uc560\ud50c\ub9ac\ucf00\uc774\uc158 \uc218\uc900 \uc720\ud6a8\uc131 \uac80\uc0ac\uc5d0\ub9cc \uc758\uc874\ud558\ub294 \ub300\uc2e0 \ub370\uc774\ud130\ubca0\uc774\uc2a4 \uc218\uc900 \uc81c\uc57d \uc870\uac74\uc744 \uc0ac\uc6a9\ud574\uc694.",tip:"CHECK, UNIQUE, NOT NULL \uc81c\uc57d \uc870\uac74\uc740 DB \ub808\ubca8\uc5d0\uc11c \ub370\uc774\ud130 \ubb34\uacb0\uc131\uc744 \ubcf4\uc7a5\ud574\uc694"},
