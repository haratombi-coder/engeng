<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>개발자 영어 플래시카드</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface-2: #1a1a1a;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
      --text: #efefed; --text-muted: #5a5855; --text-dim: #2e2c2a;
      --warm: #d4a574; --blue: #7eb8f7; --green: #7ecf9e;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(10,10,10,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 7px; height: 7px; background: var(--warm); border-radius: 50%; }
    .prog-text { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .topic-bar { border-bottom: 1px solid var(--border); overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none; }
    .topic-bar::-webkit-scrollbar { display: none; }
    .topic-inner { display: flex; padding: 0 2rem; min-width: max-content; }
    .topic-tab { padding: 11px 16px; font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
    .topic-tab:hover { color: var(--text); }
    .topic-tab.active { color: var(--warm); border-bottom-color: var(--warm); }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1rem; gap: 1.5rem; }
    .card-wrap { width: 100%; max-width: 560px; perspective: 1000px; animation: fadeIn 0.3s ease; }
    .card { width: 100%; min-height: 300px; position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); cursor: pointer; }
    .card.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); padding: 2rem; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .card-back { transform: rotateY(180deg); background: var(--surface-2); }
    .lang-label { font-size: 10px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    .en-label { color: var(--blue); }
    .es-label { color: var(--green); }
    .ko-label { color: var(--warm); }
    .en-text { font-size: clamp(18px, 3.5vw, 26px); font-weight: 800; line-height: 1.4; color: var(--text); }
    .es-text { font-size: clamp(13px, 2vw, 16px); font-weight: 700; line-height: 1.5; color: var(--green); }
    .ko-text { font-size: clamp(13px, 2vw, 16px); font-weight: 700; line-height: 1.5; color: var(--warm); }
    .tap-hint { font-size: 11px; font-weight: 700; color: var(--text-dim); margin-top: auto; text-align: center; }
    .tip-box { font-size: 12px; font-weight: 600; color: var(--text-muted); background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; line-height: 1.6; margin-top: 4px; }
    .tts-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .tts-btn { height: 36px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .tts-btn.en { color: var(--blue); border-color: rgba(126,184,247,0.2); }
    .tts-btn.en:hover { border-color: rgba(126,184,247,0.4); }
    .tts-btn.es { color: var(--green); border-color: rgba(126,207,158,0.2); }
    .tts-btn.es:hover { border-color: rgba(126,207,158,0.4); }
    .nav-row { display: flex; align-items: center; gap: 16px; }
    .nav-btn { width: 48px; height: 48px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; color: var(--text); font-family: 'Nunito', sans-serif; }
    .nav-btn:hover { border-color: var(--border-hover); background: var(--surface-2); }
    .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .prog-wrap { width: 160px; height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .prog-fill { height: 100%; background: var(--warm); border-radius: 99px; transition: width 0.3s ease; }
    .shuffle-btn { height: 34px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; font-size: 12px; font-weight: 700; font-family: 'Nunito', sans-serif; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
    .shuffle-btn:hover { border-color: var(--border-hover); color: var(--text); }
    footer { text-align: center; padding: 1.5rem; font-size: 11px; font-weight: 700; color: var(--text-dim); border-top: 1px solid var(--border); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { header { padding: 0 1rem; } .topic-inner { padding: 0 1rem; } }
  </style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-dot"></span>개발자 영어</div>
  <div class="prog-text" id="progText">1 / 30</div>

    <div class="topic-tab" onclick="setTopic(1,this)">📄 공식 문서</div>
    <div class="topic-tab" onclick="setTopic(2,this)">🐙 GitHub/SO</div>
    <div class="topic-tab" onclick="setTopic(3,this)">🔍 검색어</div>
    <div class="topic-tab" onclick="setTopic(4,this)">💬 커뮤니케이션</div>
    <div class="topic-tab" onclick="setTopic(5,this)">⌨️ 터미널</div>
    <div class="topic-tab" onclick="setTopic(6,this)">👀 코드 리뷰</div>
    <div class="topic-tab" onclick="setTopic(7,this)">⚛️ React/Next.js</div>
    <div class="topic-tab" onclick="setTopic(8,this)">🔌 백엔드/API</div>
    <div class="topic-tab" onclick="setTopic(9,this)">🗄️ 데이터베이스</div>
  </div>
</div>
<main id="main"></main>
<footer>개발자 영어 플래시카드 · 총 502개 문장</footer>

    {en:'This endpoint requires authentication.',es:'Este endpoint requiere autenticación.',ko:'이 엔드포인트는 인증이 필요해요.',tip:'JWT 토큰이나 세션으로 인증을 구현해요'},
    {en:'Rate limiting is applied to prevent abuse.',es:'Se aplica limitación de velocidad para prevenir abusos.',ko:'남용을 방지하기 위해 속도 제한이 적용돼요.',tip:'express-rate-limit 같은 미들웨어로 구현해요'},
    {en:'Use HTTPS to encrypt data in transit.',es:'Usa HTTPS para cifrar datos en tránsito.',ko:'전송 중인 데이터를 암호화하려면 HTTPS를 사용해요.',tip:'Let\'s Encrypt로 무료 SSL 인증서를 받을 수 있어요'},
    {en:'The API follows RESTful conventions.',es:'La API sigue las convenciones RESTful.',ko:'이 API는 RESTful 규칙을 따라요.',tip:'GET/POST/PUT/DELETE/PATCH 메서드를 올바르게 사용해요'},
    {en:'Implement idempotency for POST requests.',es:'Implementa idempotencia para las solicitudes POST.',ko:'POST 요청에 대한 멱등성을 구현해요.',tip:'idempotent = 같은 요청을 여러 번 해도 결과가 동일한 거예요'},
    {en:'Cache frequently accessed data to improve performance.',es:'Almacena en caché los datos de acceso frecuente para mejorar el rendimiento.',ko:'성능 향상을 위해 자주 접근하는 데이터를 캐시해요.',tip:'Redis를 인메모리 캐시로 많이 사용해요'},
    {en:'Use environment variables for sensitive configuration.',es:'Usa variables de entorno para la configuración sensible.',ko:'민감한 설정에는 환경 변수를 사용해요.',tip:'API 키, DB 비밀번호는 절대 코드에 하드코딩하면 안 돼요'},
    {en:'The request payload is too large.',es:'El payload de la solicitud es demasiado grande.',ko:'요청 페이로드가 너무 커요.',tip:'413 Payload Too Large 에러예요. 파일 크기 제한을 설정해요'},
    {en:'Implement graceful shutdown to handle in-flight requests.',es:'Implementa un apagado elegante para manejar solicitudes en vuelo.',ko:'처리 중인 요청을 처리하기 위해 Graceful Shutdown을 구현해요.',tip:'SIGTERM 신호를 받으면 진행 중인 요청을 완료 후 종료해요'},
    {en:'Use connection pooling for database connections.',es:'Usa agrupación de conexiones para las conexiones de base de datos.',ko:'데이터베이스 연결에 커넥션 풀링을 사용해요.',tip:'연결을 매번 새로 만들지 않고 재사용해서 성능을 높여요'},
    {en:'Log the request ID for easier debugging.',es:'Registra el ID de solicitud para facilitar la depuración.',ko:'더 쉬운 디버깅을 위해 요청 ID를 로깅해요.',tip:'각 요청에 고유 ID를 붙이면 로그 추적이 쉬워요'},
    {en:'This endpoint is versioned as /api/v2/',es:'Este endpoint tiene la versión /api/v2/',ko:'이 엔드포인트는 /api/v2/로 버전이 지정됐어요.',tip:'API 버전 관리로 하위 호환성을 유지할 수 있어요'},
    {en:'Use async/await with proper error handling in Express.',es:'Usa async/await con manejo de errores adecuado en Express.',ko:'Express에서 적절한 에러 처리와 함께 async/await을 사용해요.',tip:'Express는 async 에러를 자동으로 처리 안 해요. try-catch 필수!'},
    {en:'The webhook payload should be verified with a secret.',es:'El payload del webhook debe verificarse con un secreto.',ko:'웹훅 페이로드는 시크릿으로 검증해야 해요.',tip:'HMAC 서명으로 웹훅이 올바른 소스에서 왔는지 확인해요'},
    {en:'Implement retry logic for failed external API calls.',es:'Implementa lógica de reintento para llamadas a API externas fallidas.',ko:'실패한 외부 API 호출에 대한 재시도 로직을 구현해요.',tip:'지수 백오프(exponential backoff)로 재시도 간격을 늘려요'},
    {en:'Use DTOs to validate and transform incoming data.',es:'Usa DTOs para validar y transformar los datos entrantes.',ko:'들어오는 데이터를 검증하고 변환하기 위해 DTO를 사용해요.',tip:'DTO = Data Transfer Object. NestJS에서 많이 사용해요'},
    {en:'This service is stateless and can be horizontally scaled.',es:'Este servicio no tiene estado y puede escalarse horizontalmente.',ko:'이 서비스는 무상태이며 수평 확장이 가능해요.',tip:'stateless = 서버가 클라이언트 상태를 저장하지 않는다는 뜻이에요'},
    {en:'Add a health check endpoint for monitoring.',es:'Agrega un endpoint de verificación de salud para monitoreo.',ko:'모니터링을 위한 헬스체크 엔드포인트를 추가해요.',tip:'/health 또는 /ping 엔드포인트로 서버 상태를 확인해요'},
    {en:'Use middleware for cross-cutting concerns.',es:'Usa middleware para preocupaciones transversales.',ko:'공통 관심사에는 미들웨어를 사용해요.',tip:'인증, 로깅, 에러 처리 같은 공통 로직을 미들웨어로 분리해요'},
    {en:'The response should include a Content-Type header.',es:'La respuesta debe incluir un encabezado Content-Type.',ko:'응답에는 Content-Type 헤더가 포함되어야 해요.',tip:'application/json, text/html 등 타입을 명시해요'},
    {en:'Implement CSRF protection for form submissions.',es:'Implementa protección CSRF para el envío de formularios.',ko:'폼 제출에 대한 CSRF 보호를 구현해요.',tip:'CSRF = Cross-Site Request Forgery. 토큰 방식으로 방어해요'},
    {en:'Use message queues for long-running tasks.',es:'Usa colas de mensajes para tareas de larga duración.',ko:'오래 실행되는 작업에는 메시지 큐를 사용해요.',tip:'Bull, RabbitMQ, AWS SQS 같은 큐를 사용해요'},
    {en:'Never store passwords in plain text.',es:'Nunca almacenes contraseñas en texto plano.',ko:'비밀번호를 평문으로 저장하면 절대 안 돼요.',tip:'bcrypt나 argon2로 해싱해서 저장해요'},
    {en:'The JWT token expires in 24 hours.',es:'El token JWT expira en 24 horas.',ko:'JWT 토큰은 24시간 후에 만료돼요.',tip:'짧은 만료 시간 + refresh token 방식이 안전해요'},
    {en:'Use GZIP compression to reduce response size.',es:'Usa compresión GZIP para reducir el tamaño de la respuesta.',ko:'응답 크기를 줄이기 위해 GZIP 압축을 사용해요.',tip:'Express에서 compression 미들웨어로 쉽게 적용해요'},
    {en:'Implement circuit breaker pattern for external services.',es:'Implementa el patrón de disyuntor para servicios externos.',ko:'외부 서비스에 대한 서킷 브레이커 패턴을 구현해요.',tip:'외부 서비스 장애 시 빠른 실패로 전체 시스템 보호해요'},
    {en:'This API supports both JSON and XML responses.',es:'Esta API admite respuestas tanto en JSON como en XML.',ko:'이 API는 JSON과 XML 응답을 모두 지원해요.',tip:'Accept 헤더로 응답 형식을 요청할 수 있어요'},
    {en:'Document your API using OpenAPI/Swagger.',es:'Documenta tu API usando OpenAPI/Swagger.',ko:'OpenAPI/Swagger를 사용해 API를 문서화해요.',tip:'Swagger UI로 API를 시각적으로 테스트할 수 있어요'},
    {en:'Always sanitize user input before processing it — even from authenticated users who might be compromised.',es:'Siempre sanitiza la entrada del usuario antes de procesarla — incluso de usuarios autenticados que podrían estar comprometidos.',ko:'처리하기 전에 항상 사용자 입력을 sanitize해요 — 손상됐을 수 있는 인증된 사용자에게서 온 것도 마찬가지예요.',tip:'입력 sanitize = 악의적인 입력이 시스템에 영향을 주지 못하도록 정제하는 것이에요'},
    {en:'Use structured logging with a consistent format so logs can be parsed and analyzed by monitoring tools.',es:'Usa el registro estructurado con un formato consistente para que los registros puedan ser analizados por herramientas de monitoreo.',ko:'모니터링 도구가 로그를 파싱하고 분석할 수 있도록 일관된 형식의 구조화된 로깅을 사용해요.',tip:'JSON 형식의 구조화된 로그는 ELK Stack이나 Datadog으로 분석하기 쉬워요'},
    {en:'The API response should include the total count for paginated results so clients know how many pages there are.',es:'La respuesta de la API debe incluir el recuento total para los resultados paginados para que los clientes sepan cuántas páginas hay.',ko:'클라이언트가 페이지 수를 알 수 있도록 API 응답에 페이지네이션된 결과의 총 개수를 포함해야 해요.',tip:'페이지네이션 응답에는 data, total, page, limit 필드를 포함하는 것이 표준이에요'},
    {en:'Implement an exponential backoff strategy for retrying failed database connections on startup.',es:'Implementa una estrategia de retroceso exponencial para reintentar las conexiones de base de datos fallidas al inicio.',ko:'시작 시 실패한 데이터베이스 연결을 재시도하기 위한 지수 백오프 전략을 구현해요.',tip:'지수 백오프 = 재시도 간격을 1초, 2초, 4초, 8초 등으로 늘리는 방식이에요'},
    {en:'Use HTTPS everywhere — even for internal microservice communication — to prevent man-in-the-middle attacks.',es:'Usa HTTPS en todas partes — incluso para la comunicación interna de microservicios — para prevenir ataques de intermediario.',ko:'중간자 공격을 방지하기 위해 내부 마이크로서비스 통신을 포함해 모든 곳에 HTTPS를 사용해요.',tip:'내부 서비스 간 통신도 암호화하는 것이 zero-trust 보안 모델이에요'},
    {en:'The 204 No Content status code is appropriate for successful DELETE operations where no response body is needed.',es:'El código de estado 204 Sin contenido es apropiado para operaciones DELETE exitosas donde no se necesita cuerpo de respuesta.',ko:'204 No Content 상태 코드는 응답 본문이 필요 없는 성공적인 DELETE 작업에 적합해요.',tip:'HTTP 상태 코드를 올바르게 사용하면 API 소비자가 결과를 쉽게 이해해요'},
    {en:'Add request tracing so you can follow a single request through all microservices using a correlation ID.',es:'Agrega rastreo de solicitudes para que puedas seguir una sola solicitud a través de todos los microservicios usando un ID de correlación.',ko:'상관 관계 ID를 사용해서 모든 마이크로서비스에서 단일 요청을 추적할 수 있도록 요청 추적을 추가해요.',tip:'correlation ID = 요청에 부여한 고유 ID로 분산 시스템에서 로그를 추적해요'},
    {en:'Validate the Content-Type header to ensure clients are sending data in the expected format.',es:'Valida el encabezado Content-Type para asegurarte de que los clientes estén enviando datos en el formato esperado.',ko:'클라이언트가 예상한 형식으로 데이터를 보내고 있는지 확인하기 위해 Content-Type 헤더를 검증해요.',tip:'잘못된 Content-Type은 데이터 파싱 오류의 원인이에요'},
    {en:'Use database transactions for operations that modify multiple tables to ensure data consistency.',es:'Usa transacciones de base de datos para operaciones que modifican múltiples tablas para asegurar la consistencia de los datos.',ko:'데이터 일관성을 보장하기 위해 여러 테이블을 수정하는 작업에 데이터베이스 트랜잭션을 사용해요.',tip:'트랜잭션은 모두 성공하거나 모두 실패하는 원자성을 보장해요'},
    {en:'The API gateway should handle cross-cutting concerns like authentication, rate limiting, and logging centrally.',es:'El gateway de API debe manejar preocupaciones transversales como autenticación, limitación de velocidad y registro de forma centralizada.',ko:'API 게이트웨이는 인증, 속도 제한, 로깅 같은 공통 관심사를 중앙에서 처리해야 해요.',tip:'API 게이트웨이 = 모든 API 요청의 단일 진입점이에요'},
    {en:'Implement graceful degradation — when a non-critical service fails, return partial data rather than failing entirely.',es:'Implementa la degradación elegante — cuando falla un servicio no crítico, devuelve datos parciales en lugar de fallar completamente.',ko:'우아한 저하를 구현해요 — 중요하지 않은 서비스가 실패하면 완전히 실패하는 대신 부분적인 데이터를 반환해요.',tip:'graceful degradation = 일부 기능이 실패해도 핵심 기능은 동작하는 설계예요'},
    {en:'Never return sensitive fields like passwords or tokens in API responses — use a serializer to filter the output.',es:'Nunca devuelvas campos sensibles como contraseñas o tokens en las respuestas de la API — usa un serializador para filtrar la salida.',ko:'API 응답에서 비밀번호나 토큰 같은 민감한 필드를 반환하지 말아요 — 출력을 필터링하기 위해 직렬화기를 사용해요.',tip:'응답 객체에서 민감한 필드를 명시적으로 제외하는 allowlist 방식이 안전해요'},
    {en:'Use idempotency keys for payment and order creation APIs to safely retry failed requests.',es:'Usa claves de idempotencia para las APIs de creación de pagos y pedidos para reintentar solicitudes fallidas de manera segura.',ko:'실패한 요청을 안전하게 재시도하기 위해 결제 및 주문 생성 API에 멱등성 키를 사용해요.',tip:'idempotency key = 중복 처리를 방지하기 위한 고유한 요청 식별자예요'},
    {en:'Add a timeout to all external API calls — never allow a slow third-party service to block your server indefinitely.',es:'Agrega un tiempo de espera a todas las llamadas a API externas — nunca permitas que un servicio de terceros lento bloquee tu servidor indefinidamente.',ko:'모든 외부 API 호출에 타임아웃을 추가해요 — 느린 서드파티 서비스가 서버를 무기한 차단하도록 허용하지 마세요.',tip:'외부 API 타임아웃을 5-30초 정도로 설정하고 타임아웃 시 적절히 처리해요'},
    {en:'The service should emit metrics for request count, latency, and error rate so they can be visualized on a dashboard.',es:'El servicio debe emitir métricas para el recuento de solicitudes, la latencia y la tasa de errores para que puedan visualizarse en un panel.',ko:'요청 수, 지연 시간, 오류율에 대한 메트릭을 대시보드에서 시각화할 수 있도록 서비스가 메트릭을 발행해야 해요.',tip:'Prometheus + Grafana 조합이 메트릭 수집과 시각화의 표준이에요'},
    {en:'Soft-delete records instead of hard-deleting them — add a deleted_at timestamp to preserve data history.',es:'Elimina registros de forma suave en lugar de eliminarlos permanentemente — agrega una marca de tiempo deleted_at para preservar el historial de datos.',ko:'데이터 기록을 보존하기 위해 하드 삭제 대신 소프트 삭제 레코드를 사용해요 — deleted_at 타임스탬프를 추가해요.',tip:'소프트 삭제는 데이터 복구와 감사(audit) 로그에 유용해요'},
    {en:'Implement request deduplication to prevent duplicate operations when clients retry failed requests.',es:'Implementa la deduplicación de solicitudes para prevenir operaciones duplicadas cuando los clientes reintentan solicitudes fallidas.',ko:'클라이언트가 실패한 요청을 재시도할 때 중복 작업을 방지하기 위해 요청 중복 제거를 구현해요.',tip:'Redis로 최근 처리한 요청 ID를 캐시해서 중복을 감지해요'},
    {en:'Use pagination for all list endpoints — never return an unbounded list that could contain millions of records.',es:'Usa paginación para todos los endpoints de lista — nunca devuelvas una lista sin límite que podría contener millones de registros.',ko:'모든 목록 엔드포인트에 페이지네이션을 사용해요 — 수백만 개의 레코드를 포함할 수 있는 무한 목록을 반환하지 마세요.',tip:'기본 limit을 20-100 사이로 설정하고 최대 limit도 제한해요'},
    {en:'The 429 Too Many Requests response should include a Retry-After header so clients know when to try again.',es:'La respuesta 429 Demasiadas solicitudes debe incluir un encabezado Retry-After para que los clientes sepan cuándo volver a intentarlo.',ko:'429 Too Many Requests 응답에는 클라이언트가 언제 다시 시도할지 알 수 있도록 Retry-After 헤더를 포함해야 해요.',tip:'Retry-After 헤더 값은 초 단위 또는 HTTP 날짜 형식이에요'},
    {en:'Consider using optimistic locking with a version field to handle concurrent updates to the same resource.',es:'Considera usar el bloqueo optimista con un campo de versión para manejar actualizaciones concurrentes al mismo recurso.',ko:'동일한 리소스에 대한 동시 업데이트를 처리하기 위해 version 필드로 낙관적 잠금 사용을 고려해요.',tip:'낙관적 잠금 = 충돌이 드물다고 가정하고 충돌 시에만 처리하는 방식이에요'}
  ],
  [ // 9: 데이터베이스
    {en:'Use an index to speed up query performance.',es:'Usa un índice para acelerar el rendimiento de las consultas.',ko:'쿼리 성능을 높이기 위해 인덱스를 사용해요.',tip:'자주 검색하는 컬럼에 인덱스를 추가하면 속도가 빨라져요'},
    {en:'Avoid SELECT * in production queries.',es:'Evita SELECT * en consultas de producción.',ko:'운영 쿼리에서 SELECT *을 피해요.',tip:'필요한 컬럼만 선택하면 네트워크 비용이 줄어요'},
    {en:'Use transactions to ensure data consistency.',es:'Usa transacciones para garantizar la consistencia de los datos.',ko:'데이터 일관성을 보장하기 위해 트랜잭션을 사용해요.',tip:'ACID 특성: 원자성, 일관성, 격리성, 지속성이에요'},
    {en:'This query has an N+1 problem.',es:'Esta consulta tiene un problema N+1.',ko:'이 쿼리에는 N+1 문제가 있어요.',tip:'JOIN이나 eager loading으로 N+1 문제를 해결해요'},
    {en:'Add a NOT NULL constraint to required columns.',es:'Agrega una restricción NOT NULL a las columnas requeridas.',ko:'필수 컬럼에 NOT NULL 제약 조건을 추가해요.',tip:'NULL이 들어오면 안 되는 컬럼을 보호해요'},
    {en:'Use parameterized queries to prevent SQL injection.',es:'Usa consultas parametrizadas para prevenir la inyección SQL.',ko:'SQL 인젝션을 방지하기 위해 파라미터화된 쿼리를 사용해요.',tip:'사용자 입력을 직접 쿼리에 넣으면 절대 안 돼요!'},
    {en:'Create a composite index for frequently used column combinations.',es:'Crea un índice compuesto para combinaciones de columnas de uso frecuente.',ko:'자주 사용하는 컬럼 조합에 복합 인덱스를 만들어요.',tip:'WHERE a = 1 AND b = 2 쿼리에는 (a, b) 복합 인덱스가 효율적이에요'},
    {en:'Run EXPLAIN to analyze query execution plan.',es:'Ejecuta EXPLAIN para analizar el plan de ejecución de consultas.',ko:'쿼리 실행 계획을 분석하려면 EXPLAIN을 실행해요.',tip:'느린 쿼리를 최적화할 때 EXPLAIN ANALYZE가 필수예요'},
    {en:'Normalize the database to reduce redundancy.',es:'Normaliza la base de datos para reducir la redundancia.',ko:'중복성을 줄이기 위해 데이터베이스를 정규화해요.',tip:'1NF, 2NF, 3NF 정규화 단계로 데이터 중복을 없애요'},
    {en:'Use soft delete instead of hard delete.',es:'Usa eliminación suave en lugar de eliminación definitiva.',ko:'하드 삭제 대신 소프트 삭제를 사용해요.',tip:'deleted_at 컬럼에 시간을 기록하는 방식이에요'},
    {en:'Add a created_at and updated_at timestamp to every table.',es:'Agrega una marca de tiempo created_at y updated_at a cada tabla.',ko:'모든 테이블에 created_at과 updated_at 타임스탬프를 추가해요.',tip:'데이터 생성/수정 시간을 추적하는 데 필수예요'},
    {en:'Foreign key constraints maintain referential integrity.',es:'Las restricciones de clave foránea mantienen la integridad referencial.',ko:'외래 키 제약 조건은 참조 무결성을 유지해요.',tip:'부모 레코드 없이 자식 레코드가 생기는 것을 방지해요'},
    {en:'Use connection pooling to manage database connections efficiently.',es:'Usa agrupación de conexiones para administrar las conexiones de base de datos de manera eficiente.',ko:'데이터베이스 연결을 효율적으로 관리하려면 커넥션 풀링을 사용해요.',tip:'매번 새 연결을 만들면 오버헤드가 커요'},
    {en:'Back up your database regularly.',es:'Haz copias de seguridad de tu base de datos regularmente.',ko:'정기적으로 데이터베이스를 백업해요.',tip:'자동 백업 스케줄을 설정하고 복구 테스트도 해요'},
    {en:'Use UUID instead of auto-increment for distributed systems.',es:'Usa UUID en lugar de auto-incremento para sistemas distribuidos.',ko:'분산 시스템에서는 자동 증가 대신 UUID를 사용해요.',tip:'여러 DB 서버에서 ID 충돌을 방지해요'},
    {en:'The UNIQUE constraint prevents duplicate values.',es:'La restricción UNIQUE evita valores duplicados.',ko:'UNIQUE 제약 조건은 중복 값을 방지해요.',tip:'이메일, 전화번호 같은 고유해야 하는 컬럼에 사용해요'},
    {en:'Use LIMIT and OFFSET for pagination.',es:'Usa LIMIT y OFFSET para la paginación.',ko:'페이지네이션을 위해 LIMIT과 OFFSET을 사용해요.',tip:'데이터가 많을 때 cursor 기반 페이지네이션이 더 효율적이에요'},
    {en:'Denormalize for read performance when needed.',es:'Desnormaliza para el rendimiento de lectura cuando sea necesario.',ko:'필요할 때 읽기 성능을 위해 비정규화해요.',tip:'정규화와 성능 사이의 트레이드오프를 고려해요'},
    {en:'This table has a one-to-many relationship.',es:'Esta tabla tiene una relación uno a muchos.',ko:'이 테이블은 일대다 관계를 가져요.',tip:'사용자 한 명이 여러 게시글을 가질 수 있는 관계예요'},
    {en:'Use a migration tool to track schema changes.',es:'Usa una herramienta de migración para rastrear los cambios de esquema.',ko:'스키마 변경을 추적하기 위해 마이그레이션 도구를 사용해요.',tip:'Flyway, Liquibase, Prisma Migrate 등을 사용해요'},
    {en:'Index the foreign key columns.',es:'Indexa las columnas de clave foránea.',ko:'외래 키 컬럼에 인덱스를 추가해요.',tip:'JOIN 시 외래 키에 인덱스가 없으면 매우 느려져요'},
    {en:'Avoid locking issues with optimistic concurrency control.',es:'Evita problemas de bloqueo con control de concurrencia optimista.',ko:'낙관적 동시성 제어로 잠금 문제를 피해요.',tip:'version 컬럼으로 충돌을 감지하는 방식이에요'},
    {en:'The query is doing a full table scan.',es:'La consulta está haciendo un escaneo completo de la tabla.',ko:'쿼리가 풀 테이블 스캔을 하고 있어요.',tip:'인덱스가 없거나 잘못 설계된 쿼리에서 발생해요. 매우 느려요'},
    {en:'Use a read replica for read-heavy workloads.',es:'Usa una réplica de lectura para cargas de trabajo de lectura intensiva.',ko:'읽기가 많은 워크로드에는 읽기 전용 복제본을 사용해요.',tip:'마스터 DB는 쓰기, 레플리카는 읽기로 부하를 분산해요'},
    {en:'Partition large tables for better performance.',es:'Particiona tablas grandes para un mejor rendimiento.',ko:'더 나은 성능을 위해 큰 테이블을 파티셔닝해요.',tip:'날짜 범위나 해시로 파티셔닝하면 쿼리 속도가 빨라져요'},
    {en:'Use COALESCE to handle NULL values.',es:'Usa COALESCE para manejar valores NULL.',ko:'NULL 값을 처리하려면 COALESCE를 사용해요.',tip:'COALESCE(column, \'default\') = NULL이면 \'default\'를 반환해요'},
    {en:'A deadlock occurred between two transactions.',es:'Ocurrió un interbloqueo entre dos transacciones.',ko:'두 트랜잭션 사이에서 데드락이 발생했어요.',tip:'트랜잭션에서 잠금 순서를 일관되게 유지하면 방지할 수 있어요'},
    {en:'Use JSONB for flexible schema in PostgreSQL.',es:'Usa JSONB para esquemas flexibles en PostgreSQL.',ko:'PostgreSQL에서 유연한 스키마를 위해 JSONB를 사용해요.',tip:'JSONB는 JSON보다 빠르고 인덱싱도 가능해요'},
    {en:'The database needs to be vacuumed.',es:'La base de datos necesita ser aspirada.',ko:'데이터베이스를 vacuum 해야 해요.',tip:'PostgreSQL의 VACUUM은 죽은 튜플을 정리해 공간을 회수해요'},
    {en:'Use stored procedures for complex business logic.',es:'Usa procedimientos almacenados para lógica de negocio compleja.',ko:'복잡한 비즈니스 로직에는 저장 프로시저를 사용해요.',tip:'DB 서버에서 실행되어 네트워크 왕복을 줄여요'},
    {en:'Always use parameterized queries or prepared statements to protect against SQL injection attacks.',es:'Siempre usa consultas parametrizadas o declaraciones preparadas para protegerte contra ataques de inyección SQL.',ko:'SQL 인젝션 공격으로부터 보호하기 위해 항상 파라미터화된 쿼리나 prepared statement를 사용해요.',tip:'user input을 쿼리에 직접 넣으면 절대 안 돼요. 항상 파라미터로 전달해요'},
    {en:'Adding an index on the foreign key column significantly speeds up JOIN queries between related tables.',es:'Agregar un índice en la columna de clave foránea acelera significativamente las consultas JOIN entre tablas relacionadas.',ko:'외래 키 컬럼에 인덱스를 추가하면 관련 테이블 간의 JOIN 쿼리가 크게 빨라져요.',tip:'외래 키 컬럼에 인덱스가 없으면 JOIN 시 전체 테이블 스캔이 발생해요'},
    {en:'Use EXPLAIN ANALYZE instead of just EXPLAIN to see actual execution times and row counts.',es:'Usa EXPLAIN ANALYZE en lugar de solo EXPLAIN para ver los tiempos de ejecución reales y los recuentos de filas.',ko:'실제 실행 시간과 행 수를 보려면 EXPLAIN만 대신 EXPLAIN ANALYZE를 사용해요.',tip:'EXPLAIN ANALYZE는 실제로 쿼리를 실행하므로 SELECT에만 사용해요'},
    {en:'Avoid using SELECT * — always specify the columns you need to reduce data transfer and improve query clarity.',es:'Evita usar SELECT * — siempre especifica las columnas que necesitas para reducir la transferencia de datos y mejorar la claridad de la consulta.',ko:'SELECT *를 피해요 — 데이터 전송을 줄이고 쿼리 명확성을 높이기 위해 필요한 컬럼을 항상 명시해요.',tip:'필요한 컬럼만 선택하면 인덱스 커버리지도 높아져요'},
    {en:'Use partial indexes to create smaller, more efficient indexes for queries with WHERE conditions.',es:'Usa índices parciales para crear índices más pequeños y eficientes para consultas con condiciones WHERE.',ko:'WHERE 조건이 있는 쿼리에 대해 더 작고 효율적인 인덱스를 만들기 위해 부분 인덱스를 사용해요.',tip:'CREATE INDEX idx ON table(col) WHERE active = true 처럼 특정 조건에만 인덱스를 적용해요'},
    {en:'A many-to-many relationship requires a junction table with foreign keys to both related tables.',es:'Una relación de muchos a muchos requiere una tabla de unión con claves foráneas para ambas tablas relacionadas.',ko:'다대다 관계는 두 관련 테이블 모두에 외래 키가 있는 중간 테이블이 필요해요.',tip:'users ↔ roles의 다대다는 user_roles 중간 테이블로 표현해요'},
    {en:'Use database-level constraints instead of relying solely on application-level validation for data integrity.',es:'Usa restricciones a nivel de base de datos en lugar de depender únicamente de la validación a nivel de aplicación para la integridad de los datos.',ko:'데이터 무결성을 위해 애플리케이션 수준 유효성 검사에만 의존하는 대신 데이터베이스 수준 제약 조건을 사용해요.',tip:'CHECK, UNIQUE, NOT NULL 제약 조건은 DB 레벨에서 데이터 무결성을 보장해요'},
    {en:'Avoid N+1 queries by using JOIN or eager loading instead of making separate queries in a loop.',es:'Evita las consultas N+1 usando JOIN o carga ansiosa en lugar de hacer consultas separadas en un bucle.',ko:'반복문에서 별도 쿼리를 만드는 대신 JOIN이나 eager loading을 사용해서 N+1 쿼리를 피해요.',tip:'N+1 = 1번 목록 조회 + N번 상세 조회. JOIN으로 1번에 해결할 수 있어요'},
    {en:'Schedule regular VACUUM ANALYZE in PostgreSQL to reclaim storage and update statistics for the query planner.',es:'Programa VACUUM ANALYZE regular en PostgreSQL para reclamar almacenamiento y actualizar estadísticas para el planificador de consultas.',ko:'스토리지를 회수하고 쿼리 플래너의 통계를 업데이트하기 위해 PostgreSQL에서 정기적인 VACUUM ANALYZE를 예약해요.',tip:'autovacuum이 기본으로 활성화돼 있지만 대용량 데이터 삭제 후에는 수동 VACUUM이 필요해요'},
    {en:'Use read replicas to distribute read traffic and reduce load on the primary database.',es:'Usa réplicas de lectura para distribuir el tráfico de lectura y reducir la carga en la base de datos principal.',ko:'읽기 트래픽을 분산하고 기본 데이터베이스의 부하를 줄이기 위해 읽기 전용 복제본을 사용해요.',tip:'쓰기는 primary, 읽기는 replica로 분산하는 것이 일반적인 확장 전략이에요'},
    {en:'Store passwords using bcrypt with a work factor of at least 12 to ensure they are computationally expensive to crack.',es:'Almacena las contraseñas usando bcrypt con un factor de trabajo de al menos 12 para asegurarte de que sean costosas computacionalmente de descifrar.',ko:'비밀번호를 해독하는 데 계산 비용이 들도록 최소 12의 작업 인수로 bcrypt를 사용해서 비밀번호를 저장해요.',tip:'bcrypt work factor 12 = 해싱에 약 250ms가 걸려서 brute force 공격을 어렵게 해요'},
    {en:'Use cursor-based pagination instead of offset-based for large datasets to avoid performance degradation.',es:'Usa paginación basada en cursor en lugar de basada en offset para grandes conjuntos de datos para evitar la degradación del rendimiento.',ko:'성능 저하를 피하기 위해 대용량 데이터셋에서 오프셋 기반 대신 커서 기반 페이지네이션을 사용해요.',tip:'OFFSET 100000은 10만 개를 건너뛰는 작업이라 느려요. cursor는 인덱스를 사용해요'},
    {en:'Implement connection timeouts and statement timeouts to prevent runaway queries from consuming all database resources.',es:'Implementa tiempos de espera de conexión y declaración para evitar que las consultas descontroladas consuman todos los recursos de la base de datos.',ko:'제어 불능 쿼리가 모든 데이터베이스 리소스를 소비하지 않도록 연결 타임아웃과 명령문 타임아웃을 구현해요.',tip:'statement_timeout = 특정 시간 이상 걸리는 쿼리를 자동으로 취소해요'},
    {en:'Use database migrations to version control your schema changes alongside your application code.',es:'Usa migraciones de base de datos para controlar la versión de los cambios de esquema junto con el código de tu aplicación.',ko:'애플리케이션 코드와 함께 스키마 변경을 버전 관리하기 위해 데이터베이스 마이그레이션을 사용해요.',tip:'마이그레이션 파일은 코드와 함께 Git으로 관리해요'},
    {en:'Avoid running schema migrations during peak traffic — schedule them during low-traffic periods or use online migrations.',es:'Evita ejecutar migraciones de esquema durante el tráfico máximo — prográmalas durante períodos de bajo tráfico o usa migraciones en línea.',ko:'피크 트래픽 중에 스키마 마이그레이션 실행을 피해요 — 트래픽이 낮은 시간에 예약하거나 온라인 마이그레이션을 사용해요.',tip:'ALTER TABLE은 테이블에 잠금을 걸어 서비스에 영향을 줄 수 있어요'},
    {en:'Use materialized views to precompute and cache complex aggregation queries that are expensive to run repeatedly.',es:'Usa vistas materializadas para precomputar y almacenar en caché consultas de agregación complejas que son costosas de ejecutar repetidamente.',ko:'반복적으로 실행하는 데 비용이 많이 드는 복잡한 집계 쿼리를 미리 계산하고 캐시하기 위해 구체화된 뷰를 사용해요.',tip:'materialized view = 쿼리 결과를 저장해둔 가상 테이블이에요. 주기적으로 REFRESH 해야 해요'},
    {en:'Monitor your database for slow queries using pg_stat_statements in PostgreSQL or the slow query log in MySQL.',es:'Monitorea tu base de datos en busca de consultas lentas usando pg_stat_statements en PostgreSQL o el registro de consultas lentas en MySQL.',ko:'PostgreSQL의 pg_stat_statements 또는 MySQL의 슬로우 쿼리 로그를 사용해서 느린 쿼리를 모니터링해요.',tip:'느린 쿼리 임계값을 100ms 이하로 설정하고 주기적으로 검토해요'},
    {en:'Use transactions with savepoints when you need partial rollback capability within a larger transaction.',es:'Usa transacciones con puntos de guardado cuando necesites capacidad de rollback parcial dentro de una transacción mayor.',ko:'더 큰 트랜잭션 내에서 부분적인 롤백 기능이 필요할 때 savepoint가 있는 트랜잭션을 사용해요.',tip:'SAVEPOINT + ROLLBACK TO SAVEPOINT 로 트랜잭션의 일부만 롤백할 수 있어요'},
    {en:'Store large binary files in object storage like S3 and keep only the reference URL in your database.',es:'Almacena archivos binarios grandes en almacenamiento de objetos como S3 y mantén solo la URL de referencia en tu base de datos.',ko:'대용량 이진 파일은 S3 같은 객체 스토리지에 저장하고 데이터베이스에는 참조 URL만 유지해요.',tip:'DB에 대용량 파일을 저장하면 성능이 크게 저하돼요. 외부 스토리지를 활용해요'},
    {en:'Use table partitioning to split large tables by date or category, which can dramatically speed up range queries.',es:'Usa la partición de tablas para dividir tablas grandes por fecha o categoría, lo que puede acelerar dramáticamente las consultas de rango.',ko:'범위 쿼리 속도를 극적으로 높일 수 있는 날짜나 카테고리별로 큰 테이블을 나누기 위해 테이블 파티셔닝을 사용해요.',tip:'파티셔닝으로 쿼리가 전체 테이블 대신 특정 파티션만 스캔하게 해요'}
  ]
];


let topicIdx = 0;
let cardIdx = 0;
let flipped = false;
let order = [];

function initOrder() {
  order = DATA[topicIdx].map((_,i)=>i);
}

function setTopic(idx, el) {
  topicIdx = idx; cardIdx = 0; flipped = false;
  initOrder();
  document.querySelectorAll('.topic-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function shuffle() {
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  cardIdx=0; flipped=false;
  render();
}

function render() {
  const s = DATA[topicIdx][order[cardIdx]];
  const total = DATA[topicIdx].length;
  flipped = false;
  document.getElementById('progText').textContent = (cardIdx+1) + ' / ' + total;
  const main = document.getElementById('main');
  main.innerHTML = '';

  // Card
  const cardWrap = document.createElement('div'); cardWrap.className = 'card-wrap';
  const card = document.createElement('div'); card.className = 'card'; card.id = 'card';
  card.onclick = flip;
  const front = document.createElement('div'); front.className = 'card-face';
  const enLabel1 = document.createElement('div'); enLabel1.className = 'lang-label en-label'; enLabel1.textContent = '🇺🇸 English';
  const enText = document.createElement('div'); enText.className = 'en-text'; enText.textContent = s.en;
  const hint = document.createElement('div'); hint.className = 'tap-hint'; hint.textContent = '탭해서 번역 보기 →';
  front.append(enLabel1, enText, hint);
  const back = document.createElement('div'); back.className = 'card-face card-back';
  const enLabel2 = document.createElement('div'); enLabel2.className = 'lang-label en-label'; enLabel2.textContent = '🇺🇸 English';
  const enSmall = document.createElement('div'); enSmall.style.cssText = 'font-size:14px;font-weight:700;color:var(--text);line-height:1.4'; enSmall.textContent = s.en;
  const esLabel = document.createElement('div'); esLabel.className = 'lang-label es-label'; esLabel.style.marginTop = '4px'; esLabel.textContent = '🇪🇸 Español';
  const esText = document.createElement('div'); esText.className = 'es-text'; esText.textContent = s.es;
  const koLabel = document.createElement('div'); koLabel.className = 'lang-label ko-label'; koLabel.style.marginTop = '4px'; koLabel.textContent = '🇰🇷 한국어';
  const koText = document.createElement('div'); koText.className = 'ko-text'; koText.textContent = s.ko;
  const tipBox = document.createElement('div'); tipBox.className = 'tip-box'; tipBox.textContent = '💡 ' + s.tip;
  back.append(enLabel2, enSmall, esLabel, esText, koLabel, koText, tipBox);
  card.append(front, back); cardWrap.appendChild(card); main.appendChild(cardWrap);

  // TTS 버튼
  const ttsRow = document.createElement('div'); ttsRow.className = 'tts-row';
  const btnEn = document.createElement('button'); btnEn.className = 'tts-btn en'; btnEn.textContent = '🔊 영어 발음';
  btnEn.onclick = (e) => { e.stopPropagation(); speakText(s.en, 'en-US'); };
  btnEn.addEventListener('touchend', (e) => { e.preventDefault(); speakText(s.en, 'en-US'); }, {passive:false});
  const btnEs = document.createElement('button'); btnEs.className = 'tts-btn es'; btnEs.textContent = '🔊 스페인어 발음';
  btnEs.onclick = (e) => { e.stopPropagation(); speakText(s.es, 'es-ES'); };
  btnEs.addEventListener('touchend', (e) => { e.preventDefault(); speakText(s.es, 'es-ES'); }, {passive:false});
  ttsRow.append(btnEn, btnEs); main.appendChild(ttsRow);

  // 네비게이션
  const navRow = document.createElement('div'); navRow.className = 'nav-row';
  const prevBtn = document.createElement('button'); prevBtn.className = 'nav-btn'; prevBtn.textContent = '←';
  prevBtn.disabled = cardIdx === 0; prevBtn.onclick = prev;
  const progWrap = document.createElement('div'); progWrap.className = 'prog-wrap';
  const progFill = document.createElement('div'); progFill.className = 'prog-fill';
  progFill.style.width = ((cardIdx+1)/total*100) + '%';
  progWrap.appendChild(progFill);
  const nextBtn = document.createElement('button'); nextBtn.className = 'nav-btn'; nextBtn.textContent = '→';
  nextBtn.disabled = cardIdx === total-1; nextBtn.onclick = next;
  navRow.append(prevBtn, progWrap, nextBtn); main.appendChild(navRow);

  // 셔플 버튼
  const shuffleBtn = document.createElement('button'); shuffleBtn.className = 'shuffle-btn';
  shuffleBtn.textContent = '🔀 랜덤 섞기'; shuffleBtn.onclick = shuffle;
  main.appendChild(shuffleBtn);
}
function flip() { flipped=!flipped; document.getElementById('card').classList.toggle('flipped',flipped); }
function prev() { if(cardIdx>0){cardIdx--;render();} }
function next() { if(cardIdx<DATA[topicIdx].length-1){cardIdx++;render();} }
function speakText(text, lang) {
  // 모바일 Safari: 재생 중이면 cancel 후 짧은 딜레이 필요
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.85;
    u.volume = 1;
    // 모바일용 음성 선택: 해당 언어 음성이 있으면 우선 사용
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      const match = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
      if (match) u.voice = match;
    }
    window.speechSynthesis.speak(u);
  }, 50);
}

// 모바일: 음성 목록을 미리 로드
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => { speechSynthesis.getVoices(); };
}

initOrder();
render();
</script>
