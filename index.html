<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>곽스트펑크영어</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111111; --surface-2: #1a1a1a;
      --border: rgba(255,255,255,0.07); --border-hover: rgba(255,255,255,0.14);
      --text: #efefed; --text-muted: #5a5855; --text-dim: #2e2c2a;
      --warm: #d4a574; --blue: #7eb8f7; --green: #7ecf9e; --red: #f07f7f;
    }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: rgba(10,10,10,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border); padding: 0 1.2rem; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .logo-dot { width: 7px; height: 7px; background: var(--warm); border-radius: 50%; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 10px; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; color: var(--text-muted);
    }
    .icon-btn:hover { border-color: var(--border-hover); color: var(--text); }
    .new-btn {
      height: 36px; padding: 0 14px; background: var(--warm); color: #0a0a0a;
      border: none; border-radius: 10px; font-size: 14px; font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer;
      display: flex; align-items: center; gap: 5px; transition: opacity 0.2s;
    }
    .new-btn:hover { opacity: 0.85; }
    .progress-wrap { padding: 12px 1.2rem 0; max-width: 640px; margin: 0 auto; }
    .progress-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .progress-stats { display: flex; gap: 12px; }
    .stat { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .stat.done { color: var(--green); }
    .stat.review { color: var(--red); }
    .stat.total { color: var(--text-muted); }
    .bar-track { height: 4px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
    .bar-done { height: 100%; background: var(--green); transition: width 0.4s; }
    .bar-review { height: 100%; background: var(--red); transition: width 0.4s; }
    main { padding: 1rem 1rem 1rem; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .section-label { font-size: 11px; font-weight: 800; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 0; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden; transition: border-color 0.2s;
      animation: fadeUp 0.3s ease both;
    }
    .card.is-done { border-color: rgba(126,207,158,0.3); }
    .card.is-review { border-color: rgba(240,127,127,0.3); }
    .card-front { padding: 1rem 1.2rem; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
    .card-top { display: flex; align-items: center; justify-content: space-between; }
    .tag { font-size: 12px; font-weight: 800; color: var(--text-dim); letter-spacing: 0.06em; }
    .card-status { font-size: 15px; }
    .en-text { font-size: 17px; font-weight: 800; color: var(--text); line-height: 1.45; }
    .tap-hint { font-size: 14px; font-weight: 700; color: var(--text-dim); text-align: right; }
    .card-back {
      display: none; flex-direction: column; gap: 6px;
      padding: 0.8rem 1.2rem; border-top: 1px solid var(--border);
    }
    .card.open .card-back { display: flex; }
    .card.open .tap-hint { display: none; }
    .ko-text { font-size: 16px; font-weight: 700; color: var(--warm); line-height: 1.5; }
    .es-text { font-size: 16px; font-weight: 700; color: var(--green); line-height: 1.5; }
    .tip-text {
      font-size: 14px; font-weight: 600; color: var(--text-muted);
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; line-height: 1.6;
    }
    .card-actions { display: none; gap: 8px; padding: 0 1.2rem 1rem; }
    .card.open .card-actions { display: flex; }
    .action-btn {
      flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-weight: 800; font-family: 'Nunito', sans-serif;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: all 0.2s; background: var(--surface);
    }
    .btn-done { color: var(--green); border-color: rgba(126,207,158,0.3); }
    .btn-done:hover { background: rgba(126,207,158,0.1); }
    .btn-done.active { background: rgba(126,207,158,0.15); border-color: var(--green); }
    .btn-review { color: var(--red); border-color: rgba(240,127,127,0.3); }
    .btn-review:hover { background: rgba(240,127,127,0.1); }
    .btn-review.active { background: rgba(240,127,127,0.15); border-color: var(--red); }
    .btn-sound { color: var(--blue); border-color: rgba(126,184,247,0.3); flex: 0; padding: 0 14px; }
    .btn-sound:hover { background: rgba(126,184,247,0.1); border-color: var(--blue); }
    .speed-wrap { padding: 0.5rem 1.2rem 1.5rem; max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
    .speed-label { font-size: 13px; font-weight: 700; color: var(--text-muted); white-space: nowrap; }
    .speed-slider { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: var(--surface-2); border-radius: 99px; outline: none; }
    .speed-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--warm); border-radius: 50%; cursor: pointer; }
    .speed-val { font-size: 14px; font-weight: 800; color: var(--warm); min-width: 36px; text-align: right; }
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); backdrop-filter: blur(6px);
      z-index: 200; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 1.5rem; width: 100%; max-width: 340px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .modal-title { font-size: 18px; font-weight: 800; }
    .modal-desc { font-size: 14px; font-weight: 600; color: var(--text-muted); line-height: 1.6; }
    .modal-btns { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .modal-btn {
      height: 46px; border-radius: 12px; font-size: 15px; font-weight: 800;
      font-family: 'Nunito', sans-serif; cursor: pointer; border: 1px solid var(--border); transition: all 0.2s;
    }
    .modal-btn.danger-all { background: rgba(240,127,127,0.12); color: var(--red); border-color: rgba(240,127,127,0.3); }
    .modal-btn.danger-all:hover { background: rgba(240,127,127,0.22); }
    .modal-btn.danger-review { background: rgba(212,165,116,0.1); color: var(--warm); border-color: rgba(212,165,116,0.3); }
    .modal-btn.danger-review:hover { background: rgba(212,165,116,0.2); }
    .modal-btn.cancel { background: var(--surface-2); color: var(--text-muted); }
    .modal-btn.cancel:hover { color: var(--text); }
    @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    footer { text-align: center; padding: 1.5rem; font-size: 13px; font-weight: 700; color: var(--text-dim); border-top: 1px solid var(--border); }
  </style>
</head>
<body>
<header>
  <div class="logo"><span class="logo-dot"></span>곽스트영어</div>
  <div class="header-right">
    <button class="icon-btn" id="settingsBtn">⚙️</button>
    <button class="new-btn" id="newBtn">🔀 새 문장</button>
  </div>
</header>
<div class="progress-wrap">
  <div class="progress-row">
    <div class="progress-stats">
      <span class="stat done" id="statDone">✅ 기억 0</span>
      <span class="stat review" id="statReview">🔁 복습 0</span>
      <span class="stat total">전체 502</span>
    </div>
    <span style="font-size:12px;font-weight:700;color:var(--text-dim)" id="statPct">0%</span>
  </div>
  <div class="bar-track">
    <div class="bar-done" id="barDone" style="width:0%"></div>
    <div class="bar-review" id="barReview" style="width:0%"></div>
  </div>
</div>
<main id="main"><div class="section-label">오늘의 10문장</div></main>
<div class="speed-wrap">
  <span class="speed-label">🐢 속도</span>
  <input type="range" class="speed-slider" id="speedSlider" min="0.5" max="1.5" step="0.1" value="0.85">
  <span class="speed-val" id="speedVal">0.9x</span>
</div>
<footer>영어 플래시카드 · 502개 문장</footer>
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">⚙️ 학습 초기화</div>
    <div class="modal-desc">체크했던 기억/복습 기록을 초기화해요.<br>전체 또는 복습 카드만 선택할 수 있어요.</div>
    <div class="modal-btns">
      <button class="modal-btn danger-all" id="resetAll">🗑️ 전체 초기화</button>
      <button class="modal-btn danger-review" id="resetReview">🔁 복습 카드만 초기화</button>
      <button class="modal-btn cancel" id="closeModal">취소</button>
    </div>
  </div>
</div>

const LABELS = ["인사/감사", "식당/카페", "쇼핑", "교통/이동", "감정 표현", "일상 대화", "부탁/거절", "약속/일정", "전화/문자", "여행/숙소"];
const ICONS  = ["🔴", "📄", "🐙", "🔍", "💬", "⌨️", "👀", "⚛️", "🔌", "🗄️"];
const TOTAL  = 502;
let speed = 0.85;
let memory = {};

function loadMemory() {
  try { memory = JSON.parse(localStorage.getItem('engeng_memory') || '{}'); } catch(e) { memory = {}; }
}
function saveMemory() {
  localStorage.setItem('engeng_memory', JSON.stringify(memory));
  updateProgress();
}
function updateProgress() {
  const vals = Object.values(memory);
  const done = vals.filter(v => v === 'done').length;
  const rev  = vals.filter(v => v === 'review').length;
  document.getElementById('statDone').textContent   = '✅ 기억 ' + done;
  document.getElementById('statReview').textContent = '🔁 복습 ' + rev;
  const pct = Math.round((done / TOTAL) * 100);
  document.getElementById('statPct').textContent  = pct + '%';
  document.getElementById('barDone').style.width   = (done / TOTAL * 100) + '%';
  document.getElementById('barReview').style.width = (rev  / TOTAL * 100) + '%';
}
function pickCard(ti) {
  const topic = DATA[ti];
  const done = [], review = [], unseen = [];
  topic.forEach((c, i) => {
    const st = memory[ti + '_' + i];
    if (st === 'done') done.push(i);
    else if (st === 'review') review.push(i);
    else unseen.push(i);
  });
  const r = Math.random();
  let pool;
  if (r < 0.70 && review.length)       pool = review;
  else if (r < 0.95 && unseen.length)  pool = unseen;
  else if (done.length)                 pool = done;
  else pool = [...review, ...unseen, ...done];
  return pool[Math.floor(Math.random() * pool.length)];
}
function speakText(text, lang) {
  window.speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = speed; u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length) {
      const match = voices.find(v => v.lang.startsWith(lang.split('-')[0]));
      if (match) u.voice = match;
    }
    window.speechSynthesis.speak(u);
  }, 50);
}
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}
function setStatus(ti, ci, status) {
  const key = ti + '_' + ci;
  memory[key] = memory[key] === status ? null : status;
  saveMemory();
  renderCards();
}
function renderCards() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="section-label">오늘의 10문장</div>';
  DATA.forEach((topic, ti) => {
    const ci   = pickCard(ti);
    const card = topic[ci];
    const st   = memory[ti + '_' + ci];
    const el   = document.createElement('div');
    el.className = 'card' + (st === 'done' ? ' is-done' : st === 'review' ? ' is-review' : '');
    el.style.animationDelay = (ti * 0.03) + 's';
    // 앞면
    const front = document.createElement('div'); front.className = 'card-front';
    front.onclick = () => el.classList.toggle('open');
    const top = document.createElement('div'); top.className = 'card-top';
    const tag = document.createElement('span'); tag.className = 'tag';
    tag.textContent = ICONS[ti] + ' ' + LABELS[ti];
    const statusEl = document.createElement('span'); statusEl.className = 'card-status';
    statusEl.textContent = st === 'done' ? '✅' : st === 'review' ? '🔁' : '';
    top.append(tag, statusEl);
    const enEl = document.createElement('div'); enEl.className = 'en-text'; enEl.textContent = card.en;
    const hint = document.createElement('div'); hint.className = 'tap-hint'; hint.textContent = '탭해서 번역 →';
    front.append(top, enEl, hint);
    // 뒷면
    const back = document.createElement('div'); back.className = 'card-back';
    const koEl = document.createElement('div'); koEl.className = 'ko-text'; koEl.textContent = card.ko;
    const esEl = document.createElement('div'); esEl.className = 'es-text'; esEl.textContent = card.es;
    const tipEl = document.createElement('div'); tipEl.className = 'tip-text'; tipEl.textContent = '💡 ' + card.tip;
    back.append(koEl, esEl, tipEl);
    // 버튼
    const actions = document.createElement('div'); actions.className = 'card-actions';
    const btnD = document.createElement('button'); btnD.className = 'action-btn btn-done' + (st === 'done' ? ' active' : '');
    btnD.textContent = '✅ 기억했어요';
    btnD.onclick = (e) => { e.stopPropagation(); setStatus(ti, ci, 'done'); };
    const btnR = document.createElement('button'); btnR.className = 'action-btn btn-review' + (st === 'review' ? ' active' : '');
    btnR.textContent = '🔁 다시볼게요';
    btnR.onclick = (e) => { e.stopPropagation(); setStatus(ti, ci, 'review'); };
    const btnS = document.createElement('button'); btnS.className = 'action-btn btn-sound';
    btnS.textContent = '🔊';
    btnS.onclick = (e) => { e.stopPropagation(); speakText(card.en, 'en-US'); };
    actions.append(btnD, btnR, btnS);
    el.append(front, back, actions);
    main.appendChild(el);
  });
}
document.getElementById('newBtn').onclick = renderCards;
document.getElementById('speedSlider').oninput = function() {
  speed = parseFloat(this.value);
  document.getElementById('speedVal').textContent = speed.toFixed(1) + 'x';
};
document.getElementById('settingsBtn').onclick = () => document.getElementById('modal').classList.add('open');
document.getElementById('closeModal').onclick  = () => document.getElementById('modal').classList.remove('open');
document.getElementById('modal').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); };
document.getElementById('resetAll').onclick = () => {
  if (confirm('전체 학습 기록을 초기화할까요?')) {
    memory = {}; saveMemory(); renderCards();
    document.getElementById('modal').classList.remove('open');
  }
};
document.getElementById('resetReview').onclick = () => {
  if (confirm('복습 카드 기록만 초기화할까요?')) {
    Object.keys(memory).forEach(k => { if (memory[k] === 'review') delete memory[k]; });
    saveMemory(); renderCards();
    document.getElementById('modal').classList.remove('open');
  }
};
loadMemory();
updateProgress();
renderCards();
</script>
</body>
